name: AIFoo UI

on:
  workflow_dispatch:
    inputs:
      publish_and_deploy:
        description: Build, publish, and activate the AIFoo frontend image
        type: boolean
        default: true
      existing_image_digest:
        description: Reuse a previously validated sha256 digest after a deployment-only failure
        type: string
        default: ''

concurrency:
  group: aifoo-ui-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ui:
    name: Validate and optionally deploy AIFoo UI
    runs-on: [self-hosted, Linux, X64, aifoo-vm]
    timeout-minutes: 90
    environment: production

    steps:
      - name: Checkout production
        uses: actions/checkout@v5
        with:
          ref: production
          fetch-depth: 1

      - name: Validate the single-workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1
          test -f .github/workflows/aifoo-ui.yml
          if grep -En '^[[:space:]]*(schedule|push|pull_request|issues):' \
            .github/workflows/aifoo-ui.yml; then
            echo "AIFoo UI must remain manual-only" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        if: ${{ inputs.existing_image_digest == '' }}
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm@10.28.2 install --frozen-lockfile

      - name: Validate frontend
        if: ${{ inputs.existing_image_digest == '' }}
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm@10.28.2 run lint:check
          corepack pnpm@10.28.2 run typecheck
          corepack pnpm@10.28.2 run test:run
          corepack pnpm@10.28.2 exec playwright install chromium
          corepack pnpm@10.28.2 run test:e2e
          corepack pnpm@10.28.2 run build

      - name: Log in to GHCR on the VM
        if: ${{ inputs.publish_and_deploy && inputs.existing_image_digest == '' }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push immutable frontend image
        if: ${{ inputs.publish_and_deploy && inputs.existing_image_digest == '' }}
        id: image
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/jayhome137/sub2api-frontend
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/aifoo-build-metadata.json"
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/frontend/Dockerfile \
            --build-arg "BUILD_VERSION=$GITHUB_SHA" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$IMAGE_REPOSITORY:ui-$GITHUB_SHA" \
            --tag "$IMAGE_REPOSITORY:latest" \
            --metadata-file "$metadata" \
            --provenance=false \
            --sbom=false \
            --push \
            .
          digest=$(jq -r '."containerimage.digest"' "$metadata")
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Build did not return an immutable digest" >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "$IMAGE_REPOSITORY" "$digest" >> "$GITHUB_OUTPUT"

      - name: Select immutable frontend image
        if: ${{ inputs.publish_and_deploy }}
        id: selected_image
        shell: bash
        env:
          BUILT_IMAGE: ${{ steps.image.outputs.image }}
          EXISTING_DIGEST: ${{ inputs.existing_image_digest }}
          IMAGE_REPOSITORY: ghcr.io/jayhome137/sub2api-frontend
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_DIGEST" ]; then
            if ! printf '%s' "$EXISTING_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "existing_image_digest must be sha256:<64 lowercase hex>" >&2
              exit 1
            fi
            selected="$IMAGE_REPOSITORY@$EXISTING_DIGEST"
          else
            selected="$BUILT_IMAGE"
          fi
          if ! printf '%s' "$selected" | grep -Eq \
            '^ghcr\.io/jayhome137/sub2api-frontend@sha256:[0-9a-f]{64}$'; then
            echo "No immutable frontend image was selected" >&2
            exit 1
          fi
          printf 'image=%s\n' "$selected" >> "$GITHUB_OUTPUT"

      - name: Configure VPS SSH
        if: ${{ inputs.publish_and_deploy }}
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Verify local update bridge
        if: ${{ inputs.publish_and_deploy }}
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_SSH_PORT" \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            'curl --fail --silent --show-error http://127.0.0.1:8091/health >/dev/null'

      - name: Activate frontend on VPS
        if: ${{ inputs.publish_and_deploy }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          IMAGE: ${{ steps.selected_image.outputs.image }}
        run: |
          set -euo pipefail
          ssh_base=(
            -p "$VPS_SSH_PORT"
            -i "$RUNNER_TEMP/ssh/id_ed25519"
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
          )
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_base[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/libexec/aifoo-deploy-helper frontend-login '$GITHUB_ACTOR'"
          trap 'ssh "${ssh_base[@]}" "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/libexec/aifoo-deploy-helper frontend-logout" >/dev/null 2>&1 || true' EXIT
          ssh "${ssh_base[@]}" "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/libexec/aifoo-deploy-helper frontend-activate '$IMAGE'"
          ssh "${ssh_base[@]}" "$VPS_USER@$VPS_HOST" \
            'curl --fail --silent --show-error http://127.0.0.1:8080/frontend-health >/dev/null && curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null'

      - name: Log out of GHCR on the VM
        if: ${{ always() && inputs.publish_and_deploy && inputs.existing_image_digest == '' }}
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
