name: One-time GHCR cleanup

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Delete retired AIFoo frontend images
    runs-on: [self-hosted, Linux, X64, aifoo-vm]
    timeout-minutes: 10
    steps:
      - name: Keep only current and previous images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/users/JayHome137/packages/container/sub2api-frontend/versions"
          version_ids=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api?per_page=100" | jq -r '.[].id')

          for version_id in $version_ids; do
            case "$version_id" in
              1169436160|1168915031) continue ;;
            esac
            curl --fail --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api/$version_id"
          done

          remaining=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api?per_page=100" | jq 'length')
          test "$remaining" -eq 2
