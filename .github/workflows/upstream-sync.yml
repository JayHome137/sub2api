name: Sync official Sub2API releases

on:
  schedule:
    # Every 6 hours, offset from busy whole-hour slots (Asia/Shanghai 02:17, 08:17, ...).
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional stable release tag; blank uses the latest official release
        required: false
        type: string
        default: ''
      retry_existing:
        description: Re-run validation for an existing upgrade branch
        required: false
        type: boolean
        default: false
      retry_final:
        description: Recover or rebuild an already merged release whose final delivery failed
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  statuses: write

concurrency:
  group: aifoo-production-mutation
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    outputs:
      release_detected: ${{ steps.prepare.outputs.release_detected }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      release_tag_object: ${{ steps.prepare.outputs.release_tag_object }}
      release_commit: ${{ steps.prepare.outputs.release_commit }}
      backend_image_digest: ${{ steps.prepare.outputs.backend_image_digest }}
      backend_image_ref: ${{ steps.prepare.outputs.backend_image_ref }}
      backend_deploy_required: ${{ steps.prepare.outputs.backend_deploy_required }}
      migrations_changed: ${{ steps.prepare.outputs.migrations_changed }}
      expected_migrations: ${{ steps.prepare.outputs.expected_migrations }}
      candidate_ready: ${{ steps.prepare.outputs.candidate_ready }}
      candidate_branch: ${{ steps.prepare.outputs.candidate_branch }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      candidate_sha: ${{ steps.prepare.outputs.candidate_sha }}
      ui_related: ${{ steps.prepare.outputs.ui_related }}
      issue_number: ${{ steps.prepare.outputs.issue_number }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
      blocked: ${{ steps.prepare.outputs.blocked }}
      final_retry: ${{ steps.prepare.outputs.final_retry }}
      final_sha: ${{ steps.prepare.outputs.final_sha }}
      frontend_preloaded: ${{ steps.prepare.outputs.frontend_preloaded }}
      backend_prepared: ${{ steps.prepare.outputs.backend_prepared }}
    steps:
      - name: Checkout AIFoo production history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: production
          fetch-depth: 0

      - name: Prepare stable release candidate
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RETRY_EXISTING: ${{ inputs.retry_existing }}
          RETRY_FINAL: ${{ inputs.retry_final }}
        run: |
          set -euo pipefail

          echo "release_detected=false" >> "$GITHUB_OUTPUT"
          echo "release_tag=" >> "$GITHUB_OUTPUT"
          echo "release_tag_object=" >> "$GITHUB_OUTPUT"
          echo "release_commit=" >> "$GITHUB_OUTPUT"
          echo "backend_image_digest=" >> "$GITHUB_OUTPUT"
          echo "backend_image_ref=" >> "$GITHUB_OUTPUT"
          echo "backend_deploy_required=false" >> "$GITHUB_OUTPUT"
          echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
          echo "expected_migrations=none" >> "$GITHUB_OUTPUT"
          echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=" >> "$GITHUB_OUTPUT"
          echo "base_sha=" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=" >> "$GITHUB_OUTPUT"
          echo "ui_related=false" >> "$GITHUB_OUTPUT"
          echo "issue_number=" >> "$GITHUB_OUTPUT"
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          echo "final_retry=false" >> "$GITHUB_OUTPUT"
          echo "final_sha=" >> "$GITHUB_OUTPUT"
          echo "frontend_preloaded=false" >> "$GITHUB_OUTPUT"
          echo "backend_prepared=false" >> "$GITHUB_OUTPUT"

          if [ "$RETRY_FINAL" = "true" ] \
            && [ "$RETRY_EXISTING" = "true" ]; then
            echo "retry_final cannot be combined with candidate retry" >&2
            exit 1
          fi

          official_repo=Wei-Shaw/sub2api
          if [ -n "$REQUESTED_TAG" ]; then
            release_json=$(gh api "repos/$official_repo/releases/tags/$REQUESTED_TAG")
          else
            release_json=$(gh api "repos/$official_repo/releases/latest")
          fi

          tag=$(printf '%s' "$release_json" | jq -r '.tag_name')
          draft=$(printf '%s' "$release_json" | jq -r '.draft')
          prerelease=$(printf '%s' "$release_json" | jq -r '.prerelease')
          release_url=$(printf '%s' "$release_json" | jq -r '.html_url')
          published_at=$(printf '%s' "$release_json" | jq -r '.published_at')

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Official release tag is not a stable semantic version: $tag" >&2
            exit 1
          fi
          if [ "$draft" != "false" ] || [ "$prerelease" != "false" ]; then
            echo "Refusing draft or prerelease tag $tag" >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/Wei-Shaw/sub2api.git
          else
            git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          fi
          git fetch origin production
          git fetch --force upstream '+refs/tags/*:refs/tags/*'
          git fetch --no-tags --force upstream "refs/tags/$tag:refs/tags/$tag"

          release_tag_object=$(git rev-parse "$tag")
          release_commit=$(git rev-parse "$tag^{}")
          if [ "$(git cat-file -t "$release_tag_object")" != "tag" ]; then
            echo "Official stable release tag must be annotated: $tag" >&2
            exit 1
          fi
          echo "release_tag_object=$release_tag_object" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

          registry_token=$(curl --fail --silent --show-error --retry 3 \
            --get \
            --data-urlencode service=registry.docker.io \
            --data-urlencode scope=repository:weishaw/sub2api:pull \
            https://auth.docker.io/token | jq -er '.token')
          manifest_headers=$(curl --fail --silent --show-error --head --retry 3 \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry-1.docker.io/v2/weishaw/sub2api/manifests/${tag#v}")
          backend_image_digest=$(printf '%s\n' "$manifest_headers" \
            | tr -d '\r' \
            | awk 'tolower($1) == "docker-content-digest:" {print $2}' \
            | tail -n 1)
          if ! printf '%s' "$backend_image_digest" \
            | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Official backend image has no valid immutable digest" >&2
            exit 1
          fi
          backend_image_ref="weishaw/sub2api@$backend_image_digest"
          echo "backend_image_digest=$backend_image_digest" >> "$GITHUB_OUTPUT"
          echo "backend_image_ref=$backend_image_ref" >> "$GITHUB_OUTPUT"

          backend_deploy_required=true
          migrations_changed=true
          expected_migrations=unknown-production-baseline
          backend_baseline_release=unknown
          backend_baseline_commit=unknown
          state_title="[State] AIFoo production backend"
          # The canonical production state issue may be closed between backend
          # activations; keep pagination compatible with older GitHub CLI versions
          # on the VM while reading the complete state history.
          state_issues=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
            | jq -s '.')
          state_records=$(jq -c --arg title "$state_title" '
            [.[][] | select(.pull_request == null and .title == $title)]
          ' <<< "$state_issues")
          state_count=$(jq 'length' <<< "$state_records")
          if [ "$(jq '[.[] | select(any(.labels[]?; .name == "backend-production-state") | not)] | length' <<< "$state_records")" -gt 0 ]; then
              echo "Production backend state issue is missing its ownership label" >&2
              exit 1
          fi
          open_state_count=$(jq '[.[] | select((.state | ascii_downcase) == "open")] | length' <<< "$state_records")
          if [ "$open_state_count" -gt 1 ]; then
            echo "Multiple open production backend state issues exist" >&2
            exit 1
          fi
          if [ "$state_count" -gt 0 ]; then
            state_record=$(jq -c '
              map(select((.state | ascii_downcase) == "open")) as $open
              | if ($open | length) == 1 then $open[0]
                else map(. + {parsed_body: (.body | fromjson)})
                  | sort_by(.parsed_body.deployed_at) | last
                end
            ' <<< "$state_records")
            state_body=$(jq -r '.body' <<< "$state_record")
            if ! jq -e '
              type == "object"
              and (keys | sort) == ([
                "schema", "kind", "generation", "status", "release_tag",
                "tag_object_sha", "peeled_commit_sha", "image_digest", "image_ref",
                "migrations_tree_sha", "production_repo_sha", "deployment_run_id",
                "deployed_at", "evidence"
              ] | sort)
              and .schema == 1
              and .kind == "aifoo.backend.production"
              and .status == "success"
              and (.generation | type == "number" and . >= 1 and floor == .)
              and (.release_tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              and (.tag_object_sha | test("^[0-9a-f]{40}$"))
              and (.peeled_commit_sha | test("^[0-9a-f]{40}$"))
              and (.image_digest | test("^sha256:[0-9a-f]{64}$"))
              and .image_ref == ("weishaw/sub2api@" + .image_digest)
              and (.migrations_tree_sha | test("^[0-9a-f]{40}$"))
              and (.production_repo_sha | test("^[0-9a-f]{40}$"))
              and (.deployment_run_id | type == "number" and . >= 1 and floor == .)
              and (.deployed_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              and .evidence == "owner-approved-workflow"
            ' <<< "$state_body" >/dev/null; then
              echo "Production backend state issue body is invalid" >&2
              exit 1
            fi

            backend_baseline_release=$(jq -r '.release_tag' <<< "$state_body")
            backend_baseline_tag_object=$(jq -r '.tag_object_sha' <<< "$state_body")
            backend_baseline_commit=$(jq -r '.peeled_commit_sha' <<< "$state_body")
            backend_baseline_digest=$(jq -r '.image_digest' <<< "$state_body")
            backend_baseline_tree=$(jq -r '.migrations_tree_sha' <<< "$state_body")
            if [ "$(git cat-file -t "$backend_baseline_release")" != "tag" ] \
              || [ "$(git rev-parse "$backend_baseline_release")" != "$backend_baseline_tag_object" ] \
              || [ "$(git rev-parse "$backend_baseline_release^{}")" != "$backend_baseline_commit" ] \
              || [ "$(git rev-parse "$backend_baseline_commit:backend/migrations")" != "$backend_baseline_tree" ]; then
              echo "Production backend state no longer matches the official tag" >&2
              exit 1
            fi
            baseline_headers=$(curl --fail --silent --show-error --head --retry 3 \
              -H "Authorization: Bearer $registry_token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://registry-1.docker.io/v2/weishaw/sub2api/manifests/${backend_baseline_release#v}")
            resolved_baseline_digest=$(printf '%s\n' "$baseline_headers" \
              | tr -d '\r' \
              | awk 'tolower($1) == "docker-content-digest:" {print $2}' \
              | tail -n 1)
            if [ "$resolved_baseline_digest" != "$backend_baseline_digest" ]; then
              echo "Official image digest drifted from the verified production baseline" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$backend_baseline_commit" "$release_commit"; then
              echo "Target release is not a forward upgrade from the production backend" >&2
              exit 1
            fi

            official_changed_paths="$RUNNER_TEMP/production-backend-changed-paths.txt"
            git diff --name-only "$backend_baseline_commit" "$release_commit" \
              | sort -u > "$official_changed_paths"
            backend_deploy_required=false
            if grep -Eq \
              '^(backend/|Dockerfile(\.goreleaser)?$|\.goreleaser(\.simple)?\.ya?ml$|deploy/docker-entrypoint\.sh$)' \
              "$official_changed_paths"; then
              backend_deploy_required=true
            fi

            migration_changes=$(git diff --name-status \
              "$backend_baseline_commit" "$release_commit" \
              -- 'backend/migrations/*.sql')
            if printf '%s\n' "$migration_changes" \
              | awk 'NF > 0 && $1 != "A" { found=1 } END { exit !found }'; then
              expected_migrations=manual-review-required
              migrations_changed=true
              backend_deploy_required=true
            else
              expected_migrations=$(printf '%s\n' "$migration_changes" \
                | awk '$1 == "A" {print $2}' \
                | sed 's#^backend/migrations/##' \
                | sort -u \
                | paste -sd, -)
              expected_migrations=${expected_migrations:-none}
              migrations_changed=false
              [ "$expected_migrations" != "none" ] && migrations_changed=true
            fi
          fi
          echo "backend_deploy_required=$backend_deploy_required" >> "$GITHUB_OUTPUT"
          echo "migrations_changed=$migrations_changed" >> "$GITHUB_OUTPUT"
          echo "expected_migrations=$expected_migrations" >> "$GITHUB_OUTPUT"

          issue_title="[Upstream $tag] AIFoo frontend compatibility"

          ensure_labels() {
            for label in upstream-release candidate-testing ui-review-required sync-failed ready-for-vps vps-preloaded vps-preload-failed backend-deploy-required backend-deployed backend-prepared backend-prepare-failed backend-production-state web-update-running web-update-failed; do
              case "$label" in
                upstream-release) color=0969DA ;;
                candidate-testing) color=FBCA04 ;;
                ui-review-required) color=D93F0B ;;
                sync-failed) color=B60205 ;;
                ready-for-vps) color=0E8A16 ;;
                vps-preloaded) color=0E8A16 ;;
                vps-preload-failed) color=B60205 ;;
                backend-deploy-required) color=5319E7 ;;
                backend-deployed) color=0E8A16 ;;
                backend-prepared) color=0E8A16 ;;
                backend-prepare-failed) color=B60205 ;;
                backend-production-state) color=1D76DB ;;
                web-update-running) color=1D76DB ;;
                web-update-failed) color=B60205 ;;
              esac
              gh label create "$label" --color "$color" --force >/dev/null
            done
          }

          find_issue_number() {
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues?state=all&labels=upstream-release&per_page=100" \
              --jq ".[] | select(.pull_request == null and .title == \"$issue_title\") | .number" \
              | sed -n '1p'
          }

          ensure_labels
          production_sha=$(git rev-parse origin/production)
          if git merge-base --is-ancestor "$release_commit" "$production_sha"; then
            issue_number=$(find_issue_number)
            if [ -n "$issue_number" ]; then
              issue_json=$(gh issue view "$issue_number" --json labels,state)
              issue_labels=$(jq -r '.labels[].name' <<< "$issue_json")
              issue_state=$(jq -r '.state' <<< "$issue_json")
              if printf '%s\n' "$issue_labels" | grep -Fxq vps-deployed; then
                for stale_label in candidate-testing ready-for-vps sync-failed ui-review-required vps-preloaded vps-preload-failed backend-deploy-required backend-prepared backend-prepare-failed web-update-running web-update-failed; do
                  if printf '%s\n' "$issue_labels" | grep -Fxq "$stale_label"; then
                    gh issue edit "$issue_number" --remove-label "$stale_label" >/dev/null
                  fi
                done
                if [ "$issue_state" != "CLOSED" ]; then
                  gh issue close "$issue_number" >/dev/null
                fi
                echo "production deployment already completed for official stable release $tag"
                {
                  echo "### Stable release check"
                  echo
                  echo "[$tag]($release_url) is already deployed. Its completed release Issue is closed; no validation, preload, or production action was started."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ "$backend_deploy_required" = "true" ]; then
                gh issue edit "$issue_number" --add-label backend-deploy-required >/dev/null
              else
                gh issue edit "$issue_number" --remove-label backend-deploy-required >/dev/null 2>&1 || true
              fi
            fi
            branch="upgrade/$tag"
            candidate_sha=$(git ls-remote --heads origin "refs/heads/$branch" \
              | awk '{print $1}' | sed -n '1p')
            ready_for_vps=false
            frontend_preloaded=false
            backend_prepared=false
            if [ -n "$issue_number" ]; then
              if printf '%s\n' "$issue_labels" | grep -Fxq ready-for-vps; then
                ready_for_vps=true
              fi
              if printf '%s\n' "$issue_labels" | grep -Fxq vps-preloaded; then
                frontend_preloaded=true
              fi
              if printf '%s\n' "$issue_labels" | grep -Fxq backend-prepared; then
                backend_prepared=true
              fi
            fi
            fully_prepared=false
            if [ "$ready_for_vps" = "true" ] \
              && [ "$frontend_preloaded" = "true" ] \
              && { [ "$backend_deploy_required" != "true" ] \
                || [ "$backend_prepared" = "true" ]; }; then
              fully_prepared=true
            fi

            if [ "$RETRY_FINAL" != "true" ] \
              && { [ -z "$issue_number" ] \
                || [ "$candidate_sha" != "$production_sha" ] \
                || [ "$fully_prepared" = "true" ]; }; then
              echo "production already contains official stable release $tag"
              {
                echo "### Stable release check"
                echo
                echo "No source update required. Production already contains [$tag]($release_url)."
                echo "Official backend image: \`$backend_image_ref\`."
                echo "Production backend baseline: \`$backend_baseline_release\` (\`$backend_baseline_commit\`)."
                echo "Backend deployment required: \`$backend_deploy_required\`."
                echo "Expected migrations from the production backend: \`$expected_migrations\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ -z "$issue_number" ]; then
              echo "Cannot retry final delivery because the exact release issue is missing" >&2
              exit 1
            fi
            if [ "$candidate_sha" != "$production_sha" ]; then
              gh issue comment "$issue_number" \
                --body "Final delivery retry was blocked because candidate branch \`$branch\` is not the exact current production commit \`$production_sha\`. No image was published or deployed."
              exit 1
            fi

            gh issue reopen "$issue_number" >/dev/null 2>&1 || true
            gh issue edit "$issue_number" --add-label upstream-release >/dev/null
            if [ "$frontend_preloaded" != "true" ]; then
              gh issue edit "$issue_number" --add-label candidate-testing >/dev/null
            fi
            for stale_label in ready-for-vps sync-failed vps-preload-failed backend-prepare-failed backend-deployed web-update-running web-update-failed; do
              gh issue edit "$issue_number" --remove-label "$stale_label" >/dev/null 2>&1 || true
            done
            echo "release_detected=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "candidate_branch=$branch" >> "$GITHUB_OUTPUT"
            echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
            echo "final_retry=true" >> "$GITHUB_OUTPUT"
            echo "final_sha=$production_sha" >> "$GITHUB_OUTPUT"
            echo "frontend_preloaded=$frontend_preloaded" >> "$GITHUB_OUTPUT"
            echo "backend_prepared=$backend_prepared" >> "$GITHUB_OUTPUT"
            {
              echo "### Final delivery retry"
              echo
              echo "Recovering the exact validated image for production commit \`$production_sha\` for [$tag]($release_url); rebuilding only if the candidate image or evidence is unavailable."
              echo "No VPS deployment will be attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$RETRY_FINAL" = "true" ]; then
            echo "Cannot retry final delivery before $tag is merged into production" >&2
            exit 1
          fi

          echo "release_detected=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          issue_number=$(find_issue_number)
          if [ -z "$issue_number" ]; then
            issue_body=$(mktemp)
            {
              echo "Official stable release: [$tag]($release_url)"
              echo
              echo "Published: $published_at"
              echo
              echo "Annotated tag object: \`$release_tag_object\`"
              echo
              echo "Peeled release commit: \`$release_commit\`"
              echo
              echo "Official backend image: \`$backend_image_ref\`"
              echo
              echo "Backend deployment required: \`$backend_deploy_required\`"
              echo
              echo "Production backend baseline: \`$backend_baseline_release\` (\`$backend_baseline_commit\`)"
              echo
              echo "Expected database migrations from production: \`$expected_migrations\`"
              echo
              echo "This issue tracks the complete official Release merge, AIFoo UI compatibility, remote validation, the private frontend image, and separate frontend/backend VPS approval gates. Scheduled synchronization never deploys to the VPS."
            } > "$issue_body"
            issue_url=$(gh issue create \
              --title "$issue_title" \
              --body-file "$issue_body" \
              --assignee "$GITHUB_REPOSITORY_OWNER" \
              --label upstream-release \
              --label candidate-testing)
            issue_number=${issue_url##*/}
          else
            gh issue reopen "$issue_number" >/dev/null 2>&1 || true
            gh issue edit "$issue_number" --add-label upstream-release --add-label candidate-testing >/dev/null
          fi
          if [ "$backend_deploy_required" = "true" ]; then
            gh issue edit "$issue_number" --add-label backend-deploy-required >/dev/null
          else
            gh issue edit "$issue_number" --remove-label backend-deploy-required >/dev/null 2>&1 || true
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

          branch="upgrade/$tag"
          echo "candidate_branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if [ "$RETRY_EXISTING" != "true" ]; then
              echo "Existing candidate $branch is awaiting review; scheduled validation will not repeat."
              echo "release_detected=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            # Keep the fork resolver executable outside the merge worktree. If
            # upstream also edits the resolver, conflict markers must not make
            # the recovery step itself unavailable.
            resolver_copy="$RUNNER_TEMP/resolve-upstream-conflicts.sh"
            cp .github/scripts/resolve-upstream-conflicts.sh "$resolver_copy"
            chmod +x "$resolver_copy"
            git checkout -b "$branch" origin/production
            if ! git merge --no-edit "$tag"; then
              conflict_log="$RUNNER_TEMP/upstream-conflict-resolution.txt"
              if ! "$resolver_copy" > "$conflict_log" 2>&1; then
                cat "$conflict_log" >&2 || true
                gh issue edit "$issue_number" --add-label sync-failed >/dev/null
                comment_file=$(mktemp)
                {
                  echo "The official $tag release still has an unresolved merge conflict after the deterministic resolver. No candidate branch was published and no deployment was attempted."
                  echo
                  echo 'Resolver output:'
                  cat "$conflict_log"
                } > "$comment_file"
                gh issue comment "$issue_number" --body-file "$comment_file"
                echo "blocked=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              cat "$conflict_log"
              comment_file=$(mktemp)
              {
                echo "The official $tag release had merge conflicts. The deterministic resolver selected only conflict hunks, preserved AIFoo UI/API boundaries, and retained upstream non-conflicting changes. Candidate validation will continue."
                echo
                echo 'Resolver decisions:'
                cat "$conflict_log"
              } > "$comment_file"
              gh issue comment "$issue_number" --body-file "$comment_file"
            fi
            git push origin "$branch"
          fi

          for stale_label in ready-for-vps sync-failed ui-review-required vps-preloaded vps-preload-failed backend-prepared backend-prepare-failed backend-deployed web-update-running web-update-failed; do
            gh issue edit "$issue_number" --remove-label "$stale_label" >/dev/null 2>&1 || true
          done

          base_sha=$(git rev-parse origin/production)
          candidate_sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$release_commit" "$candidate_sha"; then
            gh issue edit "$issue_number" --add-label sync-failed >/dev/null
            gh issue comment "$issue_number" \
              --body "Candidate \`$candidate_sha\` no longer contains official release commit \`$release_commit\` for $tag. Restore the exact Release merge before retrying; nothing was merged or deployed."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$base_sha" "$candidate_sha"; then
            gh issue edit "$issue_number" --add-label sync-failed >/dev/null
            gh issue comment "$issue_number" \
              --body "Candidate \`$candidate_sha\` is not based on current production \`$base_sha\`. Rebase or recreate the candidate before retrying; nothing was merged or deployed."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$RUNNER_TEMP/upstream-changed-paths.txt"
          git diff --name-only "$base_sha...$candidate_sha" | sort -u > "$changed_paths"

          direct_ui=false
          backend_contract=false
          ui_related=false
          if grep -Eq '^(frontend/|deploy/frontend/|docs/legal/|backend/internal/web/)' "$changed_paths"; then
            direct_ui=true
          fi
          if grep -E '^(backend/ent/schema/|backend/internal/(domain|middleware|model|pkg/response|setup)/|backend/internal/server/(routes|middleware)/|backend/internal/handler/.*\.go$|backend/internal/service/(admin_|auth|channel_|group_|payment|setting|settings|subscription|user_).*\.go$)' "$changed_paths" \
            | grep -Ev '(_test\.go$|/testdata/)' >/dev/null; then
            backend_contract=true
          fi
          if [ "$direct_ui" = "true" ] || [ "$backend_contract" = "true" ]; then
            ui_related=true
          fi

          migration_note="Expected official database migrations: $expected_migrations."

          pr_number=$(gh pr list --state open --base production --head "$branch" --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            pr_body=$(mktemp)
            {
              echo "Automated candidate from official stable release [$tag]($release_url)."
              echo
              echo "- UI-related paths changed: \`$ui_related\`"
              echo "- Direct frontend surface changed: \`$direct_ui\`"
              echo "- Potential backend-to-frontend contract changed: \`$backend_contract\`"
              echo "- Official release commit: \`$release_commit\`"
              echo "- Official backend image: \`$backend_image_ref\`"
              echo "- Backend production deployment required: \`$backend_deploy_required\`"
              echo "- $migration_note"
              echo "- Candidate commit: \`$candidate_sha\`"
              echo
              echo "Candidate CI, security, AIFoo browser tests, and image smoke tests run inside the release-sync workflow. UI-related releases auto-merge when the official Release merges cleanly and every deterministic check passes; newly added upstream surfaces retain their official UI by default. Merging, validating, and publishing artifacts do not deploy them to the VPS."
            } > "$pr_body"
            pr_url=$(gh pr create \
              --base production \
              --head "$branch" \
              --title "Upgrade Sub2API to $tag" \
              --body-file "$pr_body")
            pr_number=${pr_url##*/}
          fi

          gh issue comment "$issue_number" --body "Candidate PR #$pr_number is ready for remote validation. Direct frontend changes: \`$direct_ui\`; potential backend-to-frontend contract changes: \`$backend_contract\`; deterministic UI compatibility checks required: \`$ui_related\`; official backend: \`$backend_image_ref\`; backend deployment required: \`$backend_deploy_required\`."

          echo "candidate_ready=true" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "ui_related=$ui_related" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

          {
            echo "### Official stable release candidate"
            echo
            echo "- Release: [$tag]($release_url)"
            echo "- Candidate: \`$candidate_sha\`"
            echo "- Production base: \`$base_sha\`"
            echo "- UI-related paths: \`$ui_related\`"
            echo "- Direct frontend surface: \`$direct_ui\`"
            echo "- Backend-to-frontend contract: \`$backend_contract\`"
            echo "- Official release commit: \`$release_commit\`"
            echo "- Official backend image: \`$backend_image_ref\`"
            echo "- Backend deployment required: \`$backend_deploy_required\`"
            echo "- Expected migrations: \`$expected_migrations\`"
            echo "- Tracking issue: #$issue_number"
            echo "- Pull request: #$pr_number"
            echo
            echo "#### Changed paths"
            sed -n '1,100p' "$changed_paths" | sed 's/^/- `/' | sed 's/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  candidate_ci:
    needs: prepare
    if: needs.prepare.outputs.candidate_ready == 'true'
    uses: ./.github/workflows/backend-ci.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.candidate_sha }}

  candidate_security:
    needs: prepare
    if: needs.prepare.outputs.candidate_ready == 'true'
    uses: ./.github/workflows/security-scan.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.candidate_sha }}

  candidate_frontend:
    needs: prepare
    if: needs.prepare.outputs.candidate_ready == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.candidate_sha }}
      publish_image: true
      publish_candidate: true

  gate:
    needs:
      - prepare
      - candidate_ci
      - candidate_security
      - candidate_frontend
    if: always() && needs.prepare.outputs.candidate_ready == 'true'
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
      final_sha: ${{ steps.gate.outputs.final_sha }}
    steps:
      - name: Apply validation and UI gates
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RESULT: ${{ needs.candidate_ci.result }}
          SECURITY_RESULT: ${{ needs.candidate_security.result }}
          FRONTEND_RESULT: ${{ needs.candidate_frontend.result }}
          UI_RELATED: ${{ needs.prepare.outputs.ui_related }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "final_sha=" >> "$GITHUB_OUTPUT"

          if [ "$CI_RESULT" != "success" ] \
            || [ "$SECURITY_RESULT" != "success" ] \
            || [ "$FRONTEND_RESULT" != "success" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            gh issue comment "$ISSUE_NUMBER" \
              --body "Candidate validation failed. CI: \`$CI_RESULT\`; security: \`$SECURITY_RESULT\`; AIFoo frontend: \`$FRONTEND_RESULT\`. Nothing was merged or deployed."
            exit 1
          fi

          current_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$current_base" != "$BASE_SHA" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            gh issue comment "$ISSUE_NUMBER" \
              --body "Production changed from validated base \`$BASE_SHA\` to \`$current_base\` while candidate checks were running. Merge is blocked until the candidate is rebased and the full workflow is rerun."
            exit 1
          fi

          pr_head=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "$pr_head" != "$CANDIDATE_SHA" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            gh issue comment "$ISSUE_NUMBER" \
              --body "PR #$PR_NUMBER moved from validated candidate \`$CANDIDATE_SHA\` to \`$pr_head\`. Merge is blocked until the exact new head is validated."
            exit 1
          fi

          if [ "$UI_RELATED" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --body "UI-related upstream changes for exact candidate \`$CANDIDATE_SHA\` passed CI, security, AIFoo browser tests, and image smoke tests. The deterministic compatibility policy approved the locked-base merge; newly added upstream surfaces retain their official UI by default."
          fi

          if ! gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/production" \
            -f sha="$CANDIDATE_SHA" \
            -F force=false >/dev/null; then
            actual_base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            gh issue comment "$ISSUE_NUMBER" \
              --body "GitHub rejected the atomic fast-forward from \`$BASE_SHA\` to \`$CANDIDATE_SHA\`; production is now \`$actual_base\`. Nothing unvalidated was merged. Rebase and rerun the full workflow."
            exit 1
          fi
          final_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$final_sha" != "$CANDIDATE_SHA" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            gh issue comment "$ISSUE_NUMBER" \
              --body "Production did not remain at the atomically validated candidate \`$CANDIDATE_SHA\`. Final image publication is blocked."
            exit 1
          fi

          candidate_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$CANDIDATE_SHA" --jq '.tree.sha')
          final_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$final_sha" --jq '.tree.sha')
          if [ "$candidate_tree" != "$final_tree" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            gh issue comment "$ISSUE_NUMBER" \
              --body "The merged production tree does not match the validated candidate tree. Final image publication is blocked."
            exit 1
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" \
            --body "Candidate checks passed and PR #$PR_NUMBER was atomically fast-forwarded into production as \`$final_sha\`. The exact validated candidate image is now being finalized without rebuilding." \
            || echo "Unable to post the non-critical post-merge comment" >&2

  recover_final:
    needs: prepare
    if: >-
      needs.prepare.outputs.final_retry == 'true' &&
      needs.prepare.outputs.frontend_preloaded != 'true'
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    permissions:
      contents: read
      packages: read
    outputs:
      reusable: ${{ steps.recover.outputs.reusable }}
      source_sha: ${{ steps.recover.outputs.source_sha }}
      image_digest: ${{ steps.recover.outputs.image_digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse a previously validated candidate when available
        id: recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_SHA: ${{ needs.prepare.outputs.final_sha }}
        run: |
          set -euo pipefail
          echo "reusable=false" >> "$GITHUB_OUTPUT"
          production_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$FINAL_SHA" != "$production_sha" ]; then
            echo "Production moved before final delivery recovery" >&2
            exit 1
          fi

          tag="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api-frontend:candidate-$FINAL_SHA"
          if ! docker pull "$tag" >/dev/null 2>&1; then
            echo "No reusable candidate image exists; a necessary rebuild will run"
            exit 0
          fi
          revision=$(docker image inspect "$tag" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          source=$(docker image inspect "$tag" \
            --format '{{index .Config.Labels "org.opencontainers.image.source"}}')
          digest=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | sed -n "s|^${tag%:*}@||p" | sed -n '1p')
          if [ "$revision" != "$FINAL_SHA" ] \
            || [ "$source" != "https://github.com/$GITHUB_REPOSITORY" ] \
            || ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Candidate image evidence is invalid; a necessary rebuild will run"
            exit 0
          fi
          echo "reusable=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"

  retry_rebuild:
    needs:
      - prepare
      - recover_final
    if: >-
      always() &&
      needs.prepare.outputs.final_retry == 'true' &&
      needs.recover_final.result == 'success' &&
      needs.recover_final.outputs.reusable != 'true'
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.final_sha }}
      publish_image: true

  finalize_frontend:
    needs:
      - prepare
      - candidate_frontend
      - gate
      - recover_final
      - retry_rebuild
    if: >-
      always() &&
      (needs.gate.outputs.merged == 'true' ||
      (needs.prepare.outputs.final_retry == 'true' &&
      needs.prepare.outputs.frontend_preloaded != 'true'))
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    permissions:
      contents: read
      packages: read
      statuses: write
    outputs:
      source_sha: ${{ steps.finalize.outputs.source_sha }}
      image_digest: ${{ steps.finalize.outputs.image_digest }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and attest the exact validated image
        id: finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED: ${{ needs.gate.outputs.merged }}
          FINAL_RETRY: ${{ needs.prepare.outputs.final_retry }}
          EXPECTED_MERGED_SHA: ${{ needs.gate.outputs.final_sha }}
          EXPECTED_RETRY_SHA: ${{ needs.prepare.outputs.final_sha }}
          CANDIDATE_RESULT: ${{ needs.candidate_frontend.result }}
          CANDIDATE_SHA: ${{ needs.candidate_frontend.outputs.source_sha }}
          CANDIDATE_DIGEST: ${{ needs.candidate_frontend.outputs.image_digest }}
          RECOVER_RESULT: ${{ needs.recover_final.result }}
          RECOVERED: ${{ needs.recover_final.outputs.reusable }}
          RECOVERED_SHA: ${{ needs.recover_final.outputs.source_sha }}
          RECOVERED_DIGEST: ${{ needs.recover_final.outputs.image_digest }}
          REBUILD_RESULT: ${{ needs.retry_rebuild.result }}
          REBUILT_SHA: ${{ needs.retry_rebuild.outputs.source_sha }}
          REBUILT_DIGEST: ${{ needs.retry_rebuild.outputs.image_digest }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$MERGED" = "true" ]; then
            if [ "$CANDIDATE_RESULT" != "success" ]; then
              echo "The merged candidate has no successful validation result" >&2
              exit 1
            fi
            expected_sha=$EXPECTED_MERGED_SHA
            source_sha=$CANDIDATE_SHA
            image_digest=$CANDIDATE_DIGEST
          elif [ "$FINAL_RETRY" = "true" ] && [ "$RECOVER_RESULT" = "success" ] \
            && [ "$RECOVERED" = "true" ]; then
            expected_sha=$EXPECTED_RETRY_SHA
            source_sha=$RECOVERED_SHA
            image_digest=$RECOVERED_DIGEST
          elif [ "$FINAL_RETRY" = "true" ] && [ "$REBUILD_RESULT" = "success" ]; then
            expected_sha=$EXPECTED_RETRY_SHA
            source_sha=$REBUILT_SHA
            image_digest=$REBUILT_DIGEST
          else
            echo "No valid candidate image or necessary rebuild is available" >&2
            exit 1
          fi

          if [ "$source_sha" != "$expected_sha" ] \
            || ! printf '%s' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Final image evidence does not match the approved source" >&2
            exit 1
          fi
          production_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$source_sha" != "$production_sha" ]; then
            echo "Production moved after candidate validation" >&2
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api-frontend@$image_digest"
          docker pull "$image" >/dev/null
          revision=$(docker image inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          source=$(docker image inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.source"}}')
          if [ "$revision" != "$source_sha" ] \
            || [ "$source" != "https://github.com/$GITHUB_REPOSITORY" ]; then
            echo "Published image provenance does not match production" >&2
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$source_sha" \
            -f state=success \
            -f context=aifoo/frontend-validation \
            -f description='Exact candidate tests, image, and rollback validation passed' \
            -f target_url="$RUN_URL" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

  notify:
    needs:
      - prepare
      - gate
      - finalize_frontend
    if: >-
      always() &&
      needs.prepare.outputs.release_detected == 'true' &&
      (needs.prepare.outputs.final_retry != 'true' ||
      needs.prepare.outputs.frontend_preloaded != 'true')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - name: Update release status issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          BLOCKED: ${{ needs.prepare.outputs.blocked }}
          UI_RELATED: ${{ needs.prepare.outputs.ui_related }}
          GATE_RESULT: ${{ needs.gate.result }}
          MERGED: ${{ needs.gate.outputs.merged }}
          FINAL_RETRY: ${{ needs.prepare.outputs.final_retry }}
          FINAL_RESULT: ${{ needs.finalize_frontend.result }}
          FINAL_SHA: ${{ needs.finalize_frontend.outputs.source_sha }}
          IMAGE_DIGEST: ${{ needs.finalize_frontend.outputs.image_digest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_TAG_OBJECT: ${{ needs.prepare.outputs.release_tag_object }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          BACKEND_IMAGE_REF: ${{ needs.prepare.outputs.backend_image_ref }}
          BACKEND_DEPLOY_REQUIRED: ${{ needs.prepare.outputs.backend_deploy_required }}
          EXPECTED_MIGRATIONS: ${{ needs.prepare.outputs.expected_migrations }}
        run: |
          set -euo pipefail

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No tracking issue was created; see the prepare job for the failure." >&2
            exit 1
          fi
          if [ "$BLOCKED" = "true" ]; then
            exit 0
          fi
          if [ "$UI_RELATED" = "true" ] && [ "$MERGED" != "true" ]; then
            exit 0
          fi
          if [ "$FINAL_RETRY" != "true" ] && [ "$GATE_RESULT" != "success" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label ready-for-vps >/dev/null 2>&1 || true
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            exit 1
          fi
          if [ "$FINAL_RETRY" != "true" ] && [ "$MERGED" != "true" ]; then
            exit 0
          fi
          if [ "$FINAL_RESULT" != "success" ] || [ -z "$IMAGE_DIGEST" ]; then
            gh issue edit "$ISSUE_NUMBER" --remove-label ready-for-vps >/dev/null 2>&1 || true
            gh issue edit "$ISSUE_NUMBER" --add-label sync-failed >/dev/null
            gh issue comment "$ISSUE_NUMBER" \
              --body "Production merged, but exact candidate image finalization failed. VPS deployment remains blocked; retry reuses the candidate image when its evidence remains valid and rebuilds only when required."
            exit 1
          fi

          for label in candidate-testing ui-review-required sync-failed vps-preloaded vps-preload-failed backend-prepared backend-prepare-failed; do
            gh issue edit "$ISSUE_NUMBER" --remove-label "$label" >/dev/null 2>&1 || true
          done
          comment_file=$(mktemp)
          {
            echo "Remote validation completed for $RELEASE_TAG."
            echo
            echo "- Final commit: \`$FINAL_SHA\`"
            echo "- Private frontend image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api-frontend@$IMAGE_DIGEST\`"
            echo "- Official tag object: \`$RELEASE_TAG_OBJECT\`"
            echo "- Official release commit: \`$RELEASE_COMMIT\`"
            echo "- Official backend image: \`$BACKEND_IMAGE_REF\`"
            echo "- Backend deployment required: \`$BACKEND_DEPLOY_REQUIRED\`"
            echo "- Expected database migrations: \`$EXPECTED_MIGRATIONS\`"
            echo "- Frontend status: \`validated; preload pending\`"
            if [ "$BACKEND_DEPLOY_REQUIRED" = "true" ]; then
              echo "- Backend status: \`validation and preload pending\`"
            else
              echo "- Backend status: \`no official backend runtime input changed\`"
            fi
            echo
            echo "The validated frontend and, when required, official backend will now be prepared on the VPS without changing production. The web button remains hidden until every required artifact is ready."
          } > "$comment_file"
          gh issue comment "$ISSUE_NUMBER" --body-file "$comment_file"

  preload_frontend:
    needs:
      - prepare
      - gate
      - finalize_frontend
      - notify
    if: >-
      always() &&
      needs.notify.result == 'success' &&
      needs.prepare.outputs.release_detected == 'true' &&
      (needs.gate.outputs.merged == 'true' || needs.prepare.outputs.final_retry == 'true') &&
      needs.prepare.outputs.frontend_preloaded != 'true' &&
      needs.finalize_frontend.result == 'success' &&
      needs.finalize_frontend.outputs.image_digest != ''
    uses: ./.github/workflows/frontend-activation.yml
    with:
      mode: preload
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      image_digest: ${{ needs.finalize_frontend.outputs.image_digest }}
      source_sha: ${{ needs.finalize_frontend.outputs.source_sha }}
      issue_number: ${{ needs.prepare.outputs.issue_number }}
    secrets: inherit

  prepare_backend:
    needs:
      - prepare
      - gate
      - finalize_frontend
      - notify
    if: >-
      always() &&
      needs.prepare.outputs.backend_deploy_required == 'true' &&
      needs.prepare.outputs.backend_prepared != 'true' &&
      needs.prepare.outputs.release_detected == 'true' &&
      (needs.gate.outputs.merged == 'true' || needs.prepare.outputs.final_retry == 'true') &&
      (needs.notify.result == 'success' ||
      (needs.prepare.outputs.final_retry == 'true' &&
      needs.prepare.outputs.frontend_preloaded == 'true')) &&
      (needs.finalize_frontend.result == 'success' ||
      (needs.prepare.outputs.final_retry == 'true' &&
      needs.prepare.outputs.frontend_preloaded == 'true'))
    uses: ./.github/workflows/backend-preparation.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      image_digest: ${{ needs.prepare.outputs.backend_image_digest }}
      source_sha: ${{ needs.prepare.outputs.final_retry == 'true' && needs.prepare.outputs.final_sha || needs.finalize_frontend.outputs.source_sha }}
      release_commit: ${{ needs.prepare.outputs.release_commit }}
      expected_migrations: ${{ needs.prepare.outputs.expected_migrations }}
      issue_number: ${{ needs.prepare.outputs.issue_number }}
    secrets: inherit

  ready_for_update:
    needs:
      - prepare
      - finalize_frontend
      - preload_frontend
      - prepare_backend
    if: >-
      always() &&
      (needs.preload_frontend.result == 'success' ||
      needs.prepare.outputs.frontend_preloaded == 'true') &&
      (needs.prepare.outputs.backend_deploy_required != 'true' ||
      needs.prepare_backend.result == 'success' ||
      needs.prepare.outputs.backend_prepared == 'true')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 5
    steps:
      - name: Expose the web update only after all required preparation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          BACKEND_DEPLOY_REQUIRED: ${{ needs.prepare.outputs.backend_deploy_required }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" --jq '.labels[].name')
          printf '%s\n' "$labels" | grep -Fxq vps-preloaded
          if [ "$BACKEND_DEPLOY_REQUIRED" = "true" ]; then
            printf '%s\n' "$labels" | grep -Fxq backend-prepared
          fi
          for blocked_label in ui-review-required sync-failed vps-preload-failed backend-prepare-failed; do
            if printf '%s\n' "$labels" | grep -Fxq "$blocked_label"; then
              echo "The release is still blocked by $blocked_label" >&2
              exit 1
            fi
          done
          gh issue edit "$ISSUE_NUMBER" --add-label ready-for-vps >/dev/null
          gh issue comment "$ISSUE_NUMBER" \
            --body "All required preparation completed for $RELEASE_TAG. The web one-click update is now available; the click path only switches the prepared production images, lets the official backend apply its migrations on startup, and performs lightweight health checks."
