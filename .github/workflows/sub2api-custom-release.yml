name: Sub2API custom full-stack release

on:
  pull_request:
    branches: [sub2api-custom]
  push:
    branches: [sub2api-custom]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated custom image and GitHub release
        type: boolean
        default: false

concurrency:
  group: sub2api-custom-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/jayhome137/sub2api
  QUALITY_RENDERER_IMAGE_REPOSITORY: ghcr.io/jayhome137/sub2api-quality-renderer

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tested ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'sub2api-custom' || github.sha }}
          fetch-depth: 1

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be a semantic version, got: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish a release
        id: publication
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${VERSION}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUESTED" = "true" ]; then
              echo "Release $release_tag already exists" >&2
              exit 1
            fi
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ] || [ "$REQUESTED" = "true" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build embedded frontend assets
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Validate pricing UI and incremental result refresh
        working-directory: frontend
        run: pnpm exec vitest run src/views/admin/ops/utils/__tests__/ttftHealth.spec.ts src/components/admin/usage/__tests__/UsageTable.spec.ts src/components/admin/account/__tests__/ScheduledTestsPanel.refresh.spec.ts src/components/user/monitor/__tests__/ChannelMonitorV3QualityHistory.refresh.spec.ts src/views/admin/__tests__/UsageView.spec.ts src/i18n/__tests__/localesMessageCompile.spec.ts

      - name: Validate affected backend paths
        working-directory: backend
        run: |
          go test ./internal/service -run 'Test(Scheduled|ScheduledVisual|RenderScheduledVisual|ReviewRequest|UpdateService)' -count=1
          go test ./internal/repository ./internal/handler/admin ./cmd/server -count=1
          go test -tags unit ./internal/service ./internal/handler -run 'Test.*(DashboardHealth|BusinessHealth|HealthScoreConfigured|WrappedUpstream|Sonnet55|Inflight|Reservation|SyncBalanceCache|StreamFailed|StreamError|AccessState|Claude55|FilterThinking)' -count=1

      - name: Validate renderer source
        run: |
          node --check backend/scripts/quality-renderer-js/server.mjs
          node --check backend/scripts/quality-renderer-js/capture.mjs
          node --check backend/scripts/quality-renderer-js/clock.mjs
          git diff --check

      - name: Validate release control plane
        shell: bash
        run: |
          set -euo pipefail
          (cd deploy/update-bridge && go test ./... && go vet ./...)
          (cd deploy/deploy-helper && go test ./... && go vet ./...)

      - name: Build Linux binary with embedded frontend
        working-directory: backend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="../artifacts/sub2api_${VERSION}_linux_amd64"
          mkdir -p "$artifact_dir"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA} -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildType=release" \
            -o "$artifact_dir/sub2api" ./cmd/server
          "$artifact_dir/sub2api" --version
          tar -C ../artifacts -czf "../artifacts/sub2api_${VERSION}_linux_amd64.tar.gz" "sub2api_${VERSION}_linux_amd64"

      - name: Build Linux release control plane
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="artifacts/sub2api_control_${VERSION}_linux_amd64"
          mkdir -p "$artifact_dir"
          (cd deploy/update-bridge && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "../../$artifact_dir/aifoo-update-bridge" .)
          (cd deploy/deploy-helper && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "../../$artifact_dir/aifoo-deploy-helper" .)
          cp deploy/update-bridge/install.sh "$artifact_dir/install.sh"
          cp deploy/update-bridge/aifoo-update-bridge.service "$artifact_dir/aifoo-update-bridge.service"
          cp deploy/update-bridge/nginx-location.conf "$artifact_dir/nginx-location.conf"
          cp deploy/update-bridge/README.md "$artifact_dir/README.md"
          printf '%s\n' "$VERSION" > "$artifact_dir/VERSION"
          chmod 0755 "$artifact_dir/aifoo-update-bridge" "$artifact_dir/aifoo-deploy-helper" "$artifact_dir/install.sh"
          tar -C artifacts -czf "artifacts/sub2api_control_${VERSION}_linux_amd64.tar.gz" \
            "sub2api_control_${VERSION}_linux_amd64"
          tar -tzf "artifacts/sub2api_control_${VERSION}_linux_amd64.tar.gz" | grep -F \
            "sub2api_control_${VERSION}_linux_amd64/aifoo-update-bridge"
          tar -tzf "artifacts/sub2api_control_${VERSION}_linux_amd64.tar.gz" | grep -F \
            "sub2api_control_${VERSION}_linux_amd64/aifoo-deploy-helper"
          (cd artifacts && sha256sum \
            "sub2api_${VERSION}_linux_amd64.tar.gz" \
            "sub2api_control_${VERSION}_linux_amd64.tar.gz" > checksums.txt)

      - name: Log in to GHCR for custom release
        if: ${{ steps.publication.outputs.publish == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build full-stack image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_REPOSITORY }}:custom-latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Build isolated quality-renderer image
        uses: docker/build-push-action@v6
        with:
          context: backend/scripts/quality-renderer-js
          file: backend/scripts/quality-renderer-js/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.publication.outputs.publish == 'true' }}
          tags: |
            ${{ env.QUALITY_RENDERER_IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.QUALITY_RENDERER_IMAGE_REPOSITORY }}:custom-latest
          provenance: false
          sbom: false

      - name: Publish custom release
        if: ${{ steps.publication.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="v${VERSION}"
          notes="$(cat <<'EOF'
          本版本更新内容：

          - 移动端降智检测历史仅显示红、绿、灰状态，不再打开检测答案或 SVG 结果。
          - 糖果题只保留后台题目/答案匹配；桌面端也不展示糖果答案文本，鹈鹕题继续保留桌面 SVG 预览。
          - 触摸设备跳过检测结果详情请求，减少移动端无用请求和弹层。

          - 运维健康评分、TTFT 卡片颜色及智能诊断统一使用已保存的 TTFT P99 基准 T，不再使用固定 500ms 诊断线及固定 1～3秒评分区间。
          - TTFT ≤T 满分且绿色，T～2T 黄色，≥2T 红色；TTFT 项在 T～3T 线性降至零。错误率、基础设施评分及权重保持不变。
          - 后端返回评分实际使用的基准，避免前端设置缓存与健康评分判断不一致；修改阈值后随仪表盘刷新生效。
          - 更新中英文设置说明和诊断建议；不修改已有阈值、单次用量记录配色、计费或生产部署。

          同步发布全栈镜像、隔离渲染器镜像和 Linux 更新控制面。
          EOF
          )"
          gh release create "$release_tag" \
            "artifacts/sub2api_${VERSION}_linux_amd64.tar.gz" \
            "artifacts/sub2api_control_${VERSION}_linux_amd64.tar.gz" \
            artifacts/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sub2API ${VERSION}" \
            --notes "$notes" \
            --latest
