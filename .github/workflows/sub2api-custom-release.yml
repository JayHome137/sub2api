name: Sub2API custom full-stack release

on:
  push:
    branches: [sub2api-custom]
  workflow_dispatch:

concurrency:
  group: sub2api-custom-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/jayhome137/sub2api

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v6
        with:
          ref: sub2api-custom
          fetch-depth: 1

      - name: Set release version
        id: version
        shell: bash
        run: printf 'version=0.3.%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Validate frontend
        working-directory: frontend
        run: |
          pnpm run lint:check
          pnpm run typecheck
          pnpm run test:run
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
          pnpm run build

      - name: Validate backend
        working-directory: backend
        run: go test ./...

      - name: Build Linux binary with embedded frontend
        id: binary
        working-directory: backend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="../artifacts/sub2api_${VERSION}_linux_amd64"
          mkdir -p "$artifact_dir"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA} -X main.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.BuildType=release" \
            -o "$artifact_dir/sub2api" ./cmd/server
          "$artifact_dir/sub2api" --version
          tar -C ../artifacts -czf "../artifacts/sub2api_${VERSION}_linux_amd64.tar.gz" "sub2api_${VERSION}_linux_amd64"
          (cd ../artifacts && sha256sum "sub2api_${VERSION}_linux_amd64.tar.gz" > checksums.txt)

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish full-stack image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_REPOSITORY }}:custom-latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          provenance: false
          sbom: false

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" artifacts/sub2api_${VERSION}_linux_amd64.tar.gz artifacts/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sub2API custom ${VERSION}" \
            --generate-notes
