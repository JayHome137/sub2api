name: Activate prepared official Sub2API backend

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Official stable release tag (vX.Y.Z)'
        required: true
        type: string
      image_digest:
        description: 'Official immutable image digest (sha256:...)'
        required: true
        type: string
      release_commit:
        description: 'Peeled official release commit prepared on the VPS'
        required: true
        type: string
      expected_migrations:
        description: 'Exact prepared migration plan, or none'
        required: true
        type: string
      issue_number:
        description: 'AIFoo upstream tracking issue number'
        required: true
        type: string
      approval:
        description: 'Type DEPLOY-AIFOO-BACKEND to approve activation'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      release_commit:
        required: true
        type: string
      expected_migrations:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      approval:
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: aifoo-production-mutation
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  activate:
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 20
    environment:
      name: production
      url: https://aifoo.cc.cd/login
    steps:
      - name: Require repository owner approval
        env:
          DEPLOY_APPROVAL: ${{ inputs.approval }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/production" ] || {
            echo "Backend activation must run from the production branch" >&2
            exit 1
          }
          actor=$(printf '%s' "$GITHUB_ACTOR" | tr '[:upper:]' '[:lower:]')
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          [ "$actor" = "$owner" ] || {
            echo "Only the repository owner can approve a backend activation" >&2
            exit 1
          }
          [ "$DEPLOY_APPROVAL" = "DEPLOY-AIFOO-BACKEND" ] || {
            echo "Backend activation approval phrase is invalid" >&2
            exit 1
          }

      - name: Checkout approved production revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify the exact prepared release evidence
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$ISSUE_NUMBER" | grep -Eq '^[0-9]+$'
          if [ "$EXPECTED_MIGRATIONS" != "none" ] \
            && ! printf '%s' "$EXPECTED_MIGRATIONS" \
              | grep -Eq '^[0-9]{3}_[a-z0-9_]+(_notx)?\.sql(,[0-9]{3}_[a-z0-9_]+(_notx)?\.sql)*$'; then
            echo "Prepared migration plan is invalid" >&2
            exit 1
          fi

          release_json=$(gh api "repos/Wei-Shaw/sub2api/releases/tags/$RELEASE_TAG")
          [ "$(jq -r '.draft' <<< "$release_json")" = false ]
          [ "$(jq -r '.prerelease' <<< "$release_json")" = false ]
          if git remote get-url official >/dev/null 2>&1; then
            git remote set-url official https://github.com/Wei-Shaw/sub2api.git
          else
            git remote add official https://github.com/Wei-Shaw/sub2api.git
          fi
          git fetch --force official "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_object=$(git rev-parse "$RELEASE_TAG")
          [ "$(git cat-file -t "$tag_object")" = tag ]
          [ "$(git rev-parse "$RELEASE_TAG^{}")" = "$RELEASE_COMMIT" ]
          git merge-base --is-ancestor "$RELEASE_COMMIT" "$GITHUB_SHA"
          production_sha=$(git ls-remote origin refs/heads/production | awk '{print $1}')
          [ "$production_sha" = "$GITHUB_SHA" ] || {
            echo "Production moved after preparation" >&2
            exit 1
          }

          issue_json=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")
          [ "$(jq -r '.title' <<< "$issue_json")" = "[Upstream $RELEASE_TAG] AIFoo frontend compatibility" ]
          labels=$(jq -r '.labels[].name' <<< "$issue_json")
          for required_label in ready-for-vps vps-preloaded backend-deploy-required backend-prepared; do
            printf '%s\n' "$labels" | grep -Fxq "$required_label"
          done
          for blocked_label in ui-review-required sync-failed vps-preload-failed backend-prepare-failed; do
            if printf '%s\n' "$labels" | grep -Fxq "$blocked_label"; then
              echo "Backend activation is blocked by $blocked_label" >&2
              exit 1
            fi
          done
          comments=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s 'add')
          image="weishaw/sub2api@$IMAGE_DIGEST"
          jq -e \
            --arg release "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg image "$image" \
            --arg migrations "$EXPECTED_MIGRATIONS" '
              any(.[];
                (.body | contains("Backend preparation completed for " + $release))
                and (.body | contains($commit))
                and (.body | contains($image))
                and (.body | contains("Expected database migrations: `" + $migrations + "`"))
                and (.body | contains("Backend status: `backend-prepared`")))
            ' <<< "$comments" >/dev/null
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

      - name: Configure restricted SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Require the exact prepared backend state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
        run: |
          set -euo pipefail
          output=$(ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-sub2api-backend prepared-status '$IMAGE_DIGEST' '$RELEASE_TAG' '$RELEASE_COMMIT' '$EXPECTED_MIGRATIONS'")
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq '^prepared_state=(ready|already-current)$'

      - name: Back up PostgreSQL only when migrations will run
        id: backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
        run: |
          set -euo pipefail
          output=$(ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-sub2api-backend backup-data '$IMAGE_DIGEST' '$RELEASE_TAG' '$RELEASE_COMMIT' '$EXPECTED_MIGRATIONS'")
          printf '%s\n' "$output"
          backup_id=$(printf '%s\n' "$output" | sed -n 's/^backup_id=//p' | tail -n 1)
          if printf '%s\n' "$output" | grep -Fxq 'backup_policy=already-current'; then
            [ "$backup_id" = none ]
          elif [ "$EXPECTED_MIGRATIONS" = none ]; then
            [ "$backup_id" = none ]
            printf '%s\n' "$output" | grep -Fxq 'backup_policy=none'
          else
            printf '%s' "$backup_id" \
              | grep -Eq '^[0-9]{8}-[0-9]{6}-[A-Za-z0-9]{6}-postgres-v[0-9]+\.[0-9]+\.[0-9]+$'
            printf '%s\n' "$output" | grep -Fxq 'backup_verified=true'
            printf '%s\n' "$output" | grep -Fxq 'backup_policy=postgresql'
          fi
          echo "backup_id=$backup_id" >> "$GITHUB_OUTPUT"

      - name: Reconfirm production revision before switching
        run: |
          production_sha=$(git ls-remote origin refs/heads/production | awk '{print $1}')
          [ "$production_sha" = "$GITHUB_SHA" ] || {
            echo "Production moved after preparation" >&2
            exit 1
          }

      - name: Switch only the prepared official backend service
        id: switch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
          DATA_BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-sub2api-backend deploy '$IMAGE_DIGEST' '$RELEASE_TAG' '$RELEASE_COMMIT' '$EXPECTED_MIGRATIONS' '$DATA_BACKUP_ID'"

      - name: Perform one public backend health check
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://aifoo.cc.cd/health | grep -q '"status":"ok"'

      - name: Close the automatic backend restore gate
        id: backend-restore-gate
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Restore the prepared previous image after activation failure
        if: >-
          (failure() || cancelled()) &&
          steps.switch.outcome == 'success' &&
          steps.backend-restore-gate.outputs.passed != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
          DATA_BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-sub2api-backend restore-image '$IMAGE_DIGEST' '$RELEASE_TAG' '$RELEASE_COMMIT' '$EXPECTED_MIGRATIONS' '$DATA_BACKUP_ID'"

      - name: Record the activated official backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG_OBJECT: ${{ steps.release.outputs.tag_object }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
          DATA_BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
        run: |
          set -euo pipefail
          gh label create backend-production-state --color 1D76DB --force >/dev/null
          state_title="[State] AIFoo production backend"
          states=$(gh issue list --state open --label backend-production-state \
            --limit 100 --json number,title,body)
          count=$(jq --arg title "$state_title" '[.[] | select(.title == $title)] | length' <<< "$states")
          [ "$count" -le 1 ] || { echo "Multiple production backend state issues exist" >&2; exit 1; }
          state_issue=
          generation=1
          if [ "$count" -eq 1 ]; then
            state_issue=$(jq -r --arg title "$state_title" '.[] | select(.title == $title) | .number' <<< "$states")
            old_state=$(jq -r --arg title "$state_title" '.[] | select(.title == $title) | .body' <<< "$states")
            generation=$(jq -er '
              select(.schema == 1 and .kind == "aifoo.backend.production")
              | .generation + 1
            ' <<< "$old_state")
          fi
          migrations_tree_sha=$(git rev-parse "$RELEASE_COMMIT:backend/migrations")
          state_file=$(mktemp)
          jq -n \
            --argjson generation "$generation" \
            --arg release_tag "$RELEASE_TAG" \
            --arg tag_object_sha "$RELEASE_TAG_OBJECT" \
            --arg peeled_commit_sha "$RELEASE_COMMIT" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg migrations_tree_sha "$migrations_tree_sha" \
            --arg production_repo_sha "$GITHUB_SHA" \
            --argjson deployment_run_id "$GITHUB_RUN_ID" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              {
                schema: 1,
                kind: "aifoo.backend.production",
                generation: $generation,
                status: "success",
                release_tag: $release_tag,
                tag_object_sha: $tag_object_sha,
                peeled_commit_sha: $peeled_commit_sha,
                image_digest: $image_digest,
                image_ref: ("weishaw/sub2api@" + $image_digest),
                migrations_tree_sha: $migrations_tree_sha,
                production_repo_sha: $production_repo_sha,
                deployment_run_id: $deployment_run_id,
                deployed_at: $deployed_at,
                evidence: "owner-approved-workflow"
              }
            ' > "$state_file"
          if [ -z "$state_issue" ]; then
            gh issue create --title "$state_title" --body-file "$state_file" \
              --label backend-production-state >/dev/null
          else
            gh issue edit "$state_issue" --body-file "$state_file" >/dev/null
          fi
          if [ "$EXPECTED_MIGRATIONS" = none ]; then
            backup_note='not required; no database migration'
          else
            backup_note="PostgreSQL custom dump $DATA_BACKUP_ID"
          fi
          gh issue comment "$ISSUE_NUMBER" \
            --body "Official backend $RELEASE_TAG activated from the prepared immutable image. Data backup: \`$backup_note\`. Frontend, PostgreSQL, and Redis containers were unchanged; database restore was not performed."
          gh label create backend-deployed --color 0E8A16 --force >/dev/null
          gh issue edit "$ISSUE_NUMBER" \
            --add-label backend-deployed \
            --remove-label backend-deploy-required \
            --remove-label backend-prepared >/dev/null
