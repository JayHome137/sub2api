name: Security Scan

on:
  pull_request:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/audit-exceptions.yml'
      - '.github/workflows/security-scan.yml'
      - 'tools/check_pnpm_audit_exceptions.py'
      - 'tools/test_*.py'
  schedule:
    - cron: '0 3 * * 1'
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact branch or commit to validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: security-scan-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    if: >-
      inputs.checkout_ref != '' ||
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          # The VM's Go build cache is large; avoid a long post-job archive/upload.
          cache: false
      - name: Verify Go version
        run: |
          expected_go_version="go$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test "$(go env GOVERSION)" = "$expected_go_version"
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/govulncheck-$attempt.log"
            if govulncheck ./... 2>&1 | tee "$log"; then
              exit 0
            fi
            status=${PIPESTATUS[0]}
            if [ "$attempt" -lt 3 ] && grep -Eqi 'vuln\.go\.dev|fetching vulnerabilities|EOF|connection reset|temporary failure|timeout' "$log"; then
              sleep $((attempt * 10))
              continue
            fi
            exit "$status"
          done

  frontend-security:
    if: >-
      inputs.checkout_ref != '' ||
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
