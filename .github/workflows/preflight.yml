name: VPS Read-only Preflight

on:
  workflow_dispatch:
    inputs:
      backend_release_tag:
        description: 'Optional official stable tag; blank checks the latest release'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: aifoo-production-mutation
  cancel-in-progress: false

jobs:
  frontend-preflight:
    # Keep read-only production checks on the repository's trusted VM runner.
    # The VM already carries the network and tool contract used by CI and
    # avoids making VPS preflight depend on hosted-runner billing capacity.
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure restricted SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Run read-only VPS preflight
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          expected_helper_sha=$(sha256sum deploy/frontend/deploy-frontend.sh | awk '{print $1}')

          set +e
          preflight_output=$(ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-sub2api-frontend preflight '$expected_helper_sha'" \
            2>&1)
          preflight_status=$?
          set -e

          printf '%s\n' "$preflight_output"
          preflight_result=$(printf '%s\n' "$preflight_output" \
            | sed -n 's/^preflight_result=//p' \
            | tail -n 1)
          blocker_count=$(printf '%s\n' "$preflight_output" \
            | sed -n 's/.*blocker_count=\([0-9][0-9]*\).*/\1/p' \
            | tail -n 1)

          {
            echo "### VPS read-only preflight"
            echo
            echo "- Result: \`${preflight_result:-ssh-failed}\`"
            echo "- Blockers: \`${blocker_count:-unknown}\`"
            echo "- Deployment files changed: \`0 expected\`"
            echo "- Containers changed: \`0 expected\`"
            echo "- Services restarted: \`0 expected\`"
            echo "- SSH/system audit logs: \`may be appended by the VPS\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$preflight_status" -ne 0 ] \
            || [ "$preflight_result" != "ready" ]; then
            echo "VPS preflight blocked deployment; no remote changes were attempted" >&2
            exit 1
          fi

  backend-preflight:
    # Use the same trusted VM runner as the rest of the delivery pipeline.
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve official backend release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.backend_release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            release_json=$(gh api "repos/Wei-Shaw/sub2api/releases/tags/$REQUESTED_TAG")
          else
            release_json=$(gh api repos/Wei-Shaw/sub2api/releases/latest)
          fi
          release_tag=$(jq -r '.tag_name' <<< "$release_json")
          if ! printf '%s' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || [ "$(jq -r '.draft' <<< "$release_json")" != "false" ] \
            || [ "$(jq -r '.prerelease' <<< "$release_json")" != "false" ]; then
            echo "Backend preflight requires an official stable Release" >&2
            exit 1
          fi

          if git remote get-url official >/dev/null 2>&1; then
            git remote set-url official https://github.com/Wei-Shaw/sub2api.git
          else
            git remote add official https://github.com/Wei-Shaw/sub2api.git
          fi
          git fetch --force official "refs/tags/$release_tag:refs/tags/$release_tag"
          release_commit=$(git rev-parse "$release_tag^{}")

          registry_token=$(curl --fail --silent --show-error --retry 3 \
            --get \
            --data-urlencode service=registry.docker.io \
            --data-urlencode scope=repository:weishaw/sub2api:pull \
            https://auth.docker.io/token | jq -er '.token')
          manifest_headers=$(curl --fail --silent --show-error --head --retry 3 \
            -H "Authorization: Bearer $registry_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://registry-1.docker.io/v2/weishaw/sub2api/manifests/${release_tag#v}")
          image_digest=$(printf '%s\n' "$manifest_headers" \
            | tr -d '\r' \
            | awk 'tolower($1) == "docker-content-digest:" {print $2}' \
            | tail -n 1)
          if ! printf '%s' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Official backend image digest could not be resolved" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Configure restricted SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Run read-only backend preflight
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          IMAGE_DIGEST: ${{ steps.release.outputs.image_digest }}
        run: |
          set -euo pipefail
          expected_helper_sha=$(sha256sum deploy/backend/deploy-backend.sh | awk '{print $1}')
          set +e
          preflight_output=$(ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-sub2api-backend preflight '$expected_helper_sha' '$IMAGE_DIGEST' '$RELEASE_TAG' '$RELEASE_COMMIT'" \
            2>&1)
          preflight_status=$?
          set -e
          printf '%s\n' "$preflight_output"
          preflight_result=$(printf '%s\n' "$preflight_output" \
            | sed -n 's/^preflight_result=//p' | tail -n 1)
          target_state=$(printf '%s\n' "$preflight_output" \
            | sed -n 's/^target_state=//p' | tail -n 1)
          {
            echo "### Backend read-only preflight"
            echo
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- Image: \`weishaw/sub2api@$IMAGE_DIGEST\`"
            echo "- Result: \`${preflight_result:-ssh-failed}\`"
            echo "- Target state: \`${target_state:-unknown}\`"
            echo "- Deployment files changed: \`0 expected\`"
            echo "- Containers changed: \`0 expected\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$preflight_status" -ne 0 ] \
            || [ "$preflight_result" != "ready" ]; then
            echo "Backend preflight blocked deployment; no remote changes were attempted" >&2
            exit 1
          fi
