name: Upstream candidate preflight

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact candidate commit to validate
        required: true
        type: string
      base_sha:
        description: Exact production base used by the candidate
        required: true
        type: string
      release_commit:
        description: Exact official release commit merged by the candidate
        required: true
        type: string
      workflow_contract_sha:
        description: Expected fork-owned workflow tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-preflight-${{ inputs.checkout_ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0

      - name: Verify candidate merge and workflow invariants
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CANDIDATE_SHA: ${{ inputs.checkout_ref }}
          WORKFLOW_CONTRACT_SHA: ${{ inputs.workflow_contract_sha }}
        run: |
          set -euo pipefail
          helper=.github/scripts/upstream-candidate-state.sh
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$("$helper" refresh-reason "$BASE_SHA" "$RELEASE_COMMIT" "$CANDIDATE_SHA")" = preserve
          test "$("$helper" workflow-contract-sha "$CANDIDATE_SHA")" = "$WORKFLOW_CONTRACT_SHA"
          git diff --check "$BASE_SHA...$CANDIDATE_SHA"
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)( |$)' "$CANDIDATE_SHA" -- .; then
            echo 'Conflict markers remain in the candidate tree' >&2
            exit 1
          fi

      - name: Verify synchronization contracts
        run: |
          set -euo pipefail
          /bin/sh -n .github/scripts/upstream-candidate-state.sh
          /bin/sh -n .github/scripts/upstream-candidate-state-test.sh
          /bin/sh -n .github/scripts/merge-upstream-release.sh
          /bin/sh -n .github/scripts/resolve-upstream-conflicts.sh
          /bin/sh .github/scripts/upstream-candidate-state-test.sh
          /bin/sh .github/scripts/merge-upstream-release-test.sh
          /bin/sh .github/scripts/resolve-upstream-conflicts-test.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies with bounded retry
        working-directory: frontend
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 5))
          done

      - name: Frontend lint and typecheck
        working-directory: frontend
        run: |
          pnpm run lint:check
          pnpm run typecheck
