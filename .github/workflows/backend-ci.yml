name: CI

on:
  push:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'Dockerfile*'
      - '.goreleaser*.yml'
      - 'Makefile'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'Dockerfile*'
      - '.goreleaser*.yml'
      - 'Makefile'
      - '.github/workflows/backend-ci.yml'
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact branch or commit to validate
        required: false
        type: string
        default: ''
      run_macos:
        description: Run macOS-only shell contracts when hosted macOS capacity is available
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/bash deploy/tests/install-checksum-test.sh
          /bin/sh deploy/frontend/workflow-contract-test.sh
          /bin/sh deploy/backend/workflow-contract-test.sh

  macos-shell:
    if: inputs.checkout_ref != '' && inputs.run_macos
    uses: ./.github/workflows/macos-shell-ci.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}

  test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          # Keep the single VM runner available; its Go cache is too large to archive per job.
          cache: false
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  golangci-lint:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          # Keep the single VM runner available; its Go cache is too large to archive per job.
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
