name: CI

on:
  pull_request:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'Dockerfile*'
      - '.goreleaser*.yml'
      - 'Makefile'
      - '.github/workflows/backend-ci.yml'
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact branch or commit to validate
        required: false
        type: string
        default: ''
      run_macos:
        description: Run macOS-only shell contracts when hosted macOS capacity is available
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    if: >-
      inputs.checkout_ref != '' ||
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/sh deploy/tests/docker-deploy-security-test.sh
          /bin/bash deploy/tests/install-checksum-test.sh
          /bin/sh deploy/frontend/workflow-contract-test.sh
          /bin/sh deploy/backend/workflow-contract-test.sh

  macos-shell:
    if: inputs.checkout_ref != '' && inputs.run_macos
    uses: ./.github/workflows/macos-shell-ci.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}

  test:
    if: >-
      inputs.checkout_ref != '' ||
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          # Keep the single VM runner available; its Go cache is too large to archive per job.
          cache: false
      - name: Verify Go version
        run: |
          expected_go_version="go$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test "$(go env GOVERSION)" = "$expected_go_version"
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  golangci-lint:
    if: >-
      inputs.checkout_ref != '' ||
      github.event_name != 'pull_request' ||
      !startsWith(github.head_ref, 'upgrade/')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          # Keep the single VM runner available; its Go cache is too large to archive per job.
          cache: false
      - name: Verify Go version
        run: |
          expected_go_version="go$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          test "$(go env GOVERSION)" = "$expected_go_version"
      - name: Select compatible golangci-lint
        id: lint_version
        run: |
          target_go_version=$(awk '$1 == "go" { print $2; exit }' backend/go.mod)
          case "$target_go_version" in
            1.26.*) golangci_version=v2.9 ;;
            1.27.*) golangci_version=v2.13 ;;
            *)
              echo "Unsupported Go version for golangci-lint: $target_go_version" >&2
              exit 1
              ;;
          esac
          echo "version=$golangci_version" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint_version.outputs.version }}
          # The action's optional JSONSchema verification downloads its schema
          # at runtime. Keep lint deterministic on the trusted VM; the linter
          # still parses the same repository config before running analyzers.
          verify: false
          # The VM has 2 vCPU and 6 GiB RAM; serialize analyzer execution to
          # avoid goanalysis dependency waits under swap pressure.
          args: --timeout=30m --concurrency=1
          working-directory: backend
