name: Validate AIFoo frontend

on:
  pull_request:
    branches:
      - production
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/frontend/**'
      - 'docs/legal/**'
      - 'Makefile'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Exact branch or commit to validate
        required: false
        type: string
        default: ''
      publish_image:
        description: Publish the validated frontend image to private GHCR
        required: false
        type: boolean
        default: false
      fast:
        description: Skip the full frontend suite when only an image refresh is required
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact branch or commit to validate
        required: false
        type: string
        default: ''
      publish_image:
        description: Publish the validated frontend image to private GHCR
        required: false
        type: boolean
        default: false
      fast:
        description: Skip the full frontend suite when only an image refresh is required
        required: false
        type: boolean
        default: false
      publish_candidate:
        description: Publish an exact open upgrade PR candidate before atomic merge
        required: false
        type: boolean
        default: false
    outputs:
      image_digest:
        description: Immutable digest produced by the frontend image build
        value: ${{ jobs.publish.outputs.image_digest }}
      source_sha:
        description: Exact source commit used by the image build
        value: ${{ jobs.image.outputs.source_sha }}

permissions:
  contents: read

concurrency:
  group: aifoo-frontend-${{ github.workflow }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: >-
      inputs.fast != true &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'upgrade/'))
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Record source commit
        id: source
        working-directory: .
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint and typecheck
        run: |
          pnpm run lint:check
          pnpm run typecheck

      - name: Full frontend Vitest suite
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Browser regression tests
        run: pnpm run test:e2e
        env:
          CI: 'true'

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aifoo-playwright-${{ steps.source.outputs.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  image:
    needs: frontend
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'upgrade/')) &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      publish_enabled: ${{ steps.publish_policy.outputs.enabled }}
      publish_mode: ${{ steps.publish_policy.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Normalize GHCR owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: publish_policy
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish_image }}
          PUBLISH_CANDIDATE: ${{ inputs.publish_candidate }}
        run: |
          set -euo pipefail
          echo "mode=none" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_CANDIDATE" = "true" ]; then
            if [ "$REQUESTED_PUBLISH" != "true" ]; then
              echo "publish_candidate=true requires publish_image=true" >&2
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
          elif [ "$REQUESTED_PUBLISH" = "true" ]; then
            source_sha=$(git rev-parse HEAD)
            production_sha=$(git ls-remote origin refs/heads/production | awk '{print $1}')
            if [ "$source_sha" != "$production_sha" ]; then
              echo "Refusing to publish a frontend image that is no longer current production" >&2
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend/Dockerfile
          load: true
          push: false
          tags: ghcr.io/${{ steps.owner.outputs.value }}/sub2api-frontend:candidate-${{ steps.source.outputs.sha }}
          build-args: |
            BUILD_VERSION=candidate-${{ steps.source.outputs.sha }}
            VCS_REF=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Run container smoke tests
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/sub2api-frontend:candidate-${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          network="aifoo-smoke-$suffix"
          backend="aifoo-smoke-backend-$suffix"
          frontend="aifoo-smoke-frontend-$suffix"

          cleanup() {
            docker rm -f "$frontend" "$backend" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network" >/dev/null
          docker run -d \
            --name "$backend" \
            --network "$network" \
            --network-alias sub2api \
            busybox:1.36 \
            sh -c 'mkdir -p /www && printf "{\"status\":\"ok\"}\n" > /www/health && httpd -f -p 8080 -h /www' \
            >/dev/null
          docker run -d \
            --name "$frontend" \
            --network "$network" \
            --publish 127.0.0.1:18080:8080 \
            "$IMAGE" \
            >/dev/null

          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect "$frontend" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          [ "$status" = "healthy" ]

          base_url=http://127.0.0.1:18080
          frontend_health=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "$base_url/frontend-health")
          grep -q '"status":"ok"' <<< "$frontend_health"
          backend_health=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "$base_url/health")
          grep -q '"status":"ok"' <<< "$backend_health"
          landing_html=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "$base_url/")
          grep -q 'AIFoo' <<< "$landing_html"

          assert_security_headers() {
            headers=$(curl --fail --silent --show-error --dump-header - --output /dev/null --connect-timeout 2 --max-time 5 "$1" | tr -d '\r')
            grep -Eqi '^X-Content-Type-Options: nosniff$' <<< "$headers"
            grep -Eqi '^Referrer-Policy: strict-origin-when-cross-origin$' <<< "$headers"
            grep -Eqi '^X-Frame-Options: DENY$' <<< "$headers"
            grep -Eqi '^Content-Security-Policy-Report-Only:' <<< "$headers"
          }

          for route in / /login /aifoo-docs-api-scripts.js /health; do
            assert_security_headers "$base_url$route"
          done

          for route in login admin/dashboard custom/preflight; do
            page=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 "$base_url/$route")
            grep -q '<div id="app"></div>' <<< "$page"
            if grep -Eq 'shell-bootstrap|console-override|auth-override|auth-preload|auth-theme-toggle' <<< "$page"; then
              echo "Legacy override reference detected on /$route" >&2
              exit 1
            fi
          done

          for asset in shell-bootstrap.js console-override.js console-override.css auth-override.js auth-override.css auth-preload.js auth-theme-toggle.js; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 2 --max-time 5 "$base_url/$asset")
            [ "$code" = "404" ]
          done

      - name: Run deployment backup and restore integration
        env:
          AIFOO_CANDIDATE_IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/sub2api-frontend:candidate-${{ steps.source.outputs.sha }}
        run: deploy/frontend/docker-workflow-integration-test.sh

      - name: Export the smoke-tested image
        if: steps.publish_policy.outputs.enabled == 'true'
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/sub2api-frontend:candidate-${{ steps.source.outputs.sha }}
        run: |
          docker image save --output "$RUNNER_TEMP/frontend-image.tar" "$IMAGE"
          cd "$RUNNER_TEMP"
          sha256sum frontend-image.tar > frontend-image.tar.sha256

      - name: Upload the smoke-tested image
        if: steps.publish_policy.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: aifoo-frontend-image-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/frontend-image.tar
            ${{ runner.temp }}/frontend-image.tar.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    if: >-
      always() &&
      needs.image.result == 'success' &&
      (
        needs.image.outputs.publish_enabled == 'true' ||
        (inputs.fast == true && inputs.publish_image == true)
      )
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Normalize GHCR owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Download the smoke-tested image
        uses: actions/download-artifact@v8
        with:
          name: aifoo-frontend-image-${{ needs.image.outputs.source_sha }}
          path: ${{ runner.temp }}/frontend-image

      - name: Verify and load the smoke-tested image
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/sub2api-frontend:candidate-${{ needs.image.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frontend-image"
          sha256sum -c frontend-image.tar.sha256
          docker image load --input frontend-image.tar >/dev/null
          image_id=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          if ! printf '%s' "$image_id" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "The verified artifact did not load the expected frontend image" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the smoke-tested image
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ steps.owner.outputs.value }}/sub2api-frontend:candidate-${{ needs.image.outputs.source_sha }}
          PUBLISH_MODE: ${{ needs.image.outputs.publish_mode }}
          FAST_MODE: ${{ inputs.fast }}
          SOURCE_SHA: ${{ needs.image.outputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_MODE" ] && [ "$FAST_MODE" = "true" ]; then
            PUBLISH_MODE=production
          fi
          case "$PUBLISH_MODE" in
            candidate)
              prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base production --limit 100 \
                --json headRefName,headRefOid)
              matching_pr_count=$(jq --arg sha "$SOURCE_SHA" '
                [.[] | select(
                  .headRefOid == $sha
                  and (.headRefName | startswith("upgrade/"))
                )] | length
              ' <<< "$prs")
              if [ "$matching_pr_count" != "1" ]; then
                echo "Candidate publication requires one exact open upgrade PR targeting production" >&2
                exit 1
              fi
              ;;
            production)
              production_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
              if [ "$SOURCE_SHA" != "$production_sha" ]; then
                echo "Production moved after image validation; the stale image will not be published" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported image publication mode: $PUBLISH_MODE" >&2
              exit 1
              ;;
          esac
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | sed -n "s|^${IMAGE%:*}@||p" | sed -n '1p')
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Unable to resolve the immutable digest of the published image" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable candidate
        run: |
          echo "### Candidate frontend image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.owner.outputs.value }}/sub2api-frontend@${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  attest:
    needs:
      - image
      - publish
    if: >-
      always() &&
      needs.image.result == 'success' &&
      (needs.image.outputs.publish_enabled != 'true' || needs.publish.result == 'success')
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record exact production validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.image.outputs.source_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          production_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$SOURCE_SHA" != "$production_sha" ]; then
            echo "Validated source is not current production; no production attestation was recorded"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state=success \
            -f context=aifoo/frontend-validation \
            -f description='Frontend, image, backup, and rollback validation passed' \
            -f target_url="$RUN_URL" >/dev/null
          echo "attested_source_sha=$SOURCE_SHA"
