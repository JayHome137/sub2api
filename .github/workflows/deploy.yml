name: Deploy AIFoo frontend

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Validated candidate digest (sha256:...)'
        required: true
        type: string
      approval:
        description: 'Type DEPLOY-AIFOO-FRONTEND to approve the production deployment'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  packages: read
  statuses: read

concurrency:
  group: aifoo-production-mutation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://aifoo.cc.cd/login
    steps:
      - name: Require repository owner approval
        env:
          DEPLOY_APPROVAL: ${{ inputs.approval }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/production" ]; then
            echo "Production deployment must run from the production branch" >&2
            exit 1
          fi
          actor=$(printf '%s' "$GITHUB_ACTOR" | tr '[:upper:]' '[:lower:]')
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          if [ "$actor" != "$owner" ]; then
            echo "Only the repository owner can approve a production deployment" >&2
            exit 1
          fi
          if [ "$DEPLOY_APPROVAL" != "DEPLOY-AIFOO-FRONTEND" ]; then
            echo "Production deployment approval phrase is invalid" >&2
            exit 1
          fi

      - name: Validate immutable digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if ! printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "image_digest must be sha256 followed by 64 lowercase hex characters" >&2
            exit 1
          fi

      - name: Checkout approved production revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require successful validation for approved production revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          production_sha=$(git ls-remote origin refs/heads/production | awk '{print $1}')
          if [ "$production_sha" != "$GITHUB_SHA" ]; then
            echo "Approved revision is no longer the current production revision" >&2
            exit 1
          fi
          statuses=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status")
          validation_url=$(jq -r '
            [.statuses[] | select(
              .context == "aifoo/frontend-validation"
              and .state == "success"
            )]
            | .[0].target_url // empty
          ' <<< "$statuses")
          expected_prefix="https://github.com/$GITHUB_REPOSITORY/actions/runs/"
          if [[ "$validation_url" != "$expected_prefix"* ]]; then
            echo "No exact-source AIFoo validation attestation exists for approved production" >&2
            exit 1
          fi
          echo "validated_run=$validation_url"

      - name: Verify validated candidate provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api-frontend@$IMAGE_DIGEST"
          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker pull "$image" >/dev/null
          image_source_sha=$(docker image inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          image_source_repo=$(docker image inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.source"}}')

          if ! printf '%s' "$image_source_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Candidate image has no valid source revision" >&2
            exit 1
          fi
          if [ "$image_source_repo" != "https://github.com/$GITHUB_REPOSITORY" ]; then
            echo "Candidate image source repository does not match this repository" >&2
            exit 1
          fi
          if ! git cat-file -e "$image_source_sha^{commit}" \
            || ! git merge-base --is-ancestor "$image_source_sha" "$GITHUB_SHA"; then
            echo "Candidate image revision is not an ancestor of approved production" >&2
            exit 1
          fi
          if ! git diff --quiet "$image_source_sha" "$GITHUB_SHA" -- \
            .dockerignore \
            frontend \
            docs/legal \
            deploy/frontend/Dockerfile \
            deploy/frontend/landing \
            deploy/frontend/nginx.conf \
            deploy/frontend/security-headers.conf; then
            echo "Frontend image inputs changed after candidate validation" >&2
            exit 1
          fi

          candidate_recorded=false
          issue_numbers=$(gh api --method GET "repos/$GITHUB_REPOSITORY/issues" \
            -f state=all -f labels=ready-for-vps -f per_page=100 --jq '.[].number')
          for issue_number in $issue_numbers; do
            comments=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" \
              -f per_page=100)
            if jq -e --arg source_sha "$image_source_sha" --arg image "$image" '
              .[] | select(
                (.body | contains($source_sha))
                and (.body | contains($image))
                and (.body | contains("ready-for-vps"))
              )
            ' <<< "$comments" >/dev/null; then
              candidate_recorded=true
              break
            fi
          done
          if [ "$candidate_recorded" != "true" ]; then
            echo "Candidate digest is not recorded by a ready-for-vps validation issue" >&2
            exit 1
          fi

      - name: Configure restricted SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Require a fresh read-only VPS preflight
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          expected_helper_sha=$(sha256sum deploy/frontend/deploy-frontend.sh | awk '{print $1}')
          output=$(ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-sub2api-frontend preflight '$expected_helper_sha'")
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -Fxq 'preflight_result=ready'; then
            echo "Fresh VPS preflight did not authorize deployment" >&2
            exit 1
          fi

      - name: Authenticate the VPS to GHCR for this job
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend login '$GITHUB_ACTOR'"

      - name: Stage and verify the validated digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend stage '$IMAGE_DIGEST'"

      - name: Back up the current frontend
        id: backup
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          output=$(ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend backup '$IMAGE_DIGEST'")
          printf '%s\n' "$output"
          backup_id=$(printf '%s\n' "$output" | sed -n 's/^backup_id=//p' | tail -n 1)
          if ! printf '%s' "$backup_id" \
            | grep -Eq '^[0-9]{8}-[0-9]{6}-[A-Za-z0-9]{6}-source-ui-frontend$'; then
            echo "The VPS did not return a valid verified backup ID" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Fxq 'backup_verified=true'; then
            echo "The VPS did not confirm backup checksum verification" >&2
            exit 1
          fi
          echo "backup_id=$backup_id" >> "$GITHUB_OUTPUT"

      - name: Reconfirm approved production revision before deployment
        run: |
          set -euo pipefail
          production_sha=$(git ls-remote origin refs/heads/production | awk '{print $1}')
          if [ "$production_sha" != "$GITHUB_SHA" ]; then
            echo "Production moved after validation; deployment is blocked" >&2
            exit 1
          fi

      - name: Deploy the staged digest after verified backup
        id: deploy
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend deploy '$IMAGE_DIGEST' '$BACKUP_ID'"

      - name: Remove staging container
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend cleanup-stage" || true

      - name: Remove temporary GHCR credentials
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend logout" || true

      - name: Public smoke checks
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://aifoo.cc.cd/frontend-health | grep -q '"status":"ok"'
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://aifoo.cc.cd/health | grep -q '"status":"ok"'
          login_html=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://aifoo.cc.cd/login)
          printf '%s' "$login_html" | grep -q '<div id="app"></div>'
          if printf '%s' "$login_html" | grep -Eq 'shell-bootstrap|console-override|auth-override|auth-preload|auth-theme-toggle'; then
            echo "Legacy override reference detected in production HTML" >&2
            exit 1
          fi

          for legacy_asset in shell-bootstrap.js console-override.js console-override.css auth-override.js auth-override.css auth-preload.js auth-theme-toggle.js; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 15 "https://aifoo.cc.cd/$legacy_asset")
            test "$status" = "404"
          done

      - name: Restore the backup after a failed deployment check
        if: (failure() || cancelled()) && steps.backup.outputs.backup_id != ''
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          BACKUP_ID: ${{ steps.backup.outputs.backup_id }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend restore '$IMAGE_DIGEST' '$BACKUP_ID'"

          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            https://aifoo.cc.cd/health | grep -q '"status":"ok"'
          landing_html=$(curl --fail --location --silent --show-error \
            --connect-timeout 5 --max-time 15 https://aifoo.cc.cd/)
          test -n "$landing_html"
          login_html=$(curl --fail --location --silent --show-error \
            --connect-timeout 5 --max-time 15 https://aifoo.cc.cd/login)
          test -n "$login_html"
