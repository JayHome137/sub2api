name: Deploy AIFoo frontend

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Validated candidate digest (sha256:...)'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aifoo.cc.cd/login
    steps:
      - name: Validate immutable digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          if ! printf '%s' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "image_digest must be sha256 followed by 64 lowercase hex characters" >&2
            exit 1
          fi

      - name: Configure restricted SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Authenticate the VPS to GHCR for this job
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend login '$GITHUB_ACTOR'"

      - name: Stage and verify the validated digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend stage '$IMAGE_DIGEST'"

      - name: Deploy the staged digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend deploy '$IMAGE_DIGEST'"

      - name: Remove staging container
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend cleanup-stage" || true

      - name: Remove temporary GHCR credentials
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo /usr/local/sbin/deploy-sub2api-frontend logout" || true

      - name: Public smoke checks
        run: |
          curl --fail --silent --show-error https://aifoo.cc.cd/frontend-health | grep -q '"status":"ok"'
          curl --fail --silent --show-error https://aifoo.cc.cd/health | grep -q '"status":"ok"'
          login_html=$(curl --fail --silent --show-error https://aifoo.cc.cd/login)
          printf '%s' "$login_html" | grep -q '<div id="app"></div>'
          if printf '%s' "$login_html" | grep -Eq 'shell-bootstrap|console-override|auth-override|auth-preload|auth-theme-toggle'; then
            echo "Legacy override reference detected in production HTML" >&2
            exit 1
          fi

          for legacy_asset in shell-bootstrap.js console-override.js console-override.css auth-override.js auth-override.css auth-preload.js auth-theme-toggle.js; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://aifoo.cc.cd/$legacy_asset")
            test "$status" = "404"
          done
