name: One-time GHCR restore

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  restore:
    name: Restore current image manifests
    runs-on: [self-hosted, Linux, X64, aifoo-vm]
    timeout-minutes: 10
    steps:
      - name: Restore and verify the current image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/users/JayHome137/packages/container/sub2api-frontend/versions"
          for version_id in 1169436097 1169436050; do
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$api/$version_id/restore"
          done

          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          image="ghcr.io/jayhome137/sub2api-frontend@sha256:8c9205146b99ed500c9a66ffe879d887acdf0c3c41b8b43670588626a0105a8c"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')" = "$image"
