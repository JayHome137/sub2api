name: Update AIFoo VPS control-plane components

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type UPDATE-AIFOO-CONTROL-PLANE to update only the VPS helper and web-update bridge'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aifoo-production-mutation
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, linux, x64, aifoo-vm]
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout the exact production revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: production
          fetch-depth: 0

      - name: Require explicit owner approval on production
        env:
          DEPLOY_APPROVAL: ${{ inputs.approval }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = 'refs/heads/production' ] || {
            echo "Control-plane updates must run from the production branch" >&2
            exit 1
          }
          actor=$(printf '%s' "$GITHUB_ACTOR" | tr '[:upper:]' '[:lower:]')
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          [ "$actor" = "$owner" ] || {
            echo "Only the repository owner can update VPS control-plane components" >&2
            exit 1
          }
          [ "$DEPLOY_APPROVAL" = 'UPDATE-AIFOO-CONTROL-PLANE' ] || {
            echo "Control-plane approval phrase is invalid" >&2
            exit 1
          }

      - name: Verify current production ref
        run: |
          set -euo pipefail
          production_sha=$(git ls-remote origin refs/heads/production | awk '{print $1}')
          [ "$production_sha" = "$GITHUB_SHA" ] || {
            echo "Production moved before control-plane maintenance began" >&2
            exit 1
          }

      - name: Set up Go for bridge verification
        uses: actions/setup-go@v6
        with:
          go-version-file: deploy/update-bridge/go.mod
          check-latest: false
          cache: false

      - name: Test and build the exact bridge binary
        working-directory: deploy/update-bridge
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o "$RUNNER_TEMP/aifoo-update-bridge" .
          test -x "$RUNNER_TEMP/aifoo-update-bridge"

      - name: Compute immutable component checksums
        id: checksums
        run: |
          set -euo pipefail
          helper_sha=$(sha256sum deploy/backend/deploy-backend.sh | awk '{print $1}')
          bridge_sha=$(sha256sum "$RUNNER_TEMP/aifoo-update-bridge" | awk '{print $1}')
          control_plane_sha=$(sha256sum deploy/control-plane/deploy-update-components.sh | awk '{print $1}')
          printf '%s\n' "$helper_sha" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$bridge_sha" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s\n' "$control_plane_sha" | grep -Eq '^[0-9a-f]{64}$'
          echo "helper_sha=$helper_sha" >> "$GITHUB_OUTPUT"
          echo "bridge_sha=$bridge_sha" >> "$GITHUB_OUTPUT"
          echo "control_plane_sha=$control_plane_sha" >> "$GITHUB_OUTPUT"

      - name: Sign the exact component manifest
        env:
          CONTROL_PLANE_SIGNING_KEY: ${{ secrets.AIFOO_CONTROL_PLANE_SIGNING_KEY }}
          HELPER_SHA: ${{ steps.checksums.outputs.helper_sha }}
          BRIDGE_SHA: ${{ steps.checksums.outputs.bridge_sha }}
          PUBLIC_KEY: deploy/control-plane/component-signing-public.pem
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/aifoo-control-plane-signing"
          key_file="$RUNNER_TEMP/aifoo-control-plane-signing/private.pem"
          manifest="$RUNNER_TEMP/aifoo-control-plane-signing/manifest.env"
          trap 'rm -f "$key_file"' EXIT HUP INT TERM
          [ -n "$CONTROL_PLANE_SIGNING_KEY" ] || {
            echo 'AIFOO_CONTROL_PLANE_SIGNING_KEY is not configured' >&2
            exit 1
          }
          printf '%s\n' "$CONTROL_PLANE_SIGNING_KEY" > "$key_file"
          chmod 600 "$key_file"
          openssl pkey -in "$key_file" -check -noout >/dev/null
          key_public_sha=$(openssl pkey -in "$key_file" -pubout \
            | sha256sum | awk '{print $1}')
          expected_public_sha=$(sha256sum "$PUBLIC_KEY" | awk '{print $1}')
          [ "$key_public_sha" = "$expected_public_sha" ] || {
            echo 'AIFOO_CONTROL_PLANE_SIGNING_KEY does not match the committed public key' >&2
            exit 1
          }
          {
            printf 'schema=1\n'
            printf 'backend_helper_sha256=%s\n' "$HELPER_SHA"
            printf 'update_bridge_sha256=%s\n' "$BRIDGE_SHA"
          } > "$manifest"
          openssl dgst -sha256 -sign "$key_file" \
            -out "$RUNNER_TEMP/aifoo-control-plane-signing/manifest.sig" "$manifest"
          test -s "$RUNNER_TEMP/aifoo-control-plane-signing/manifest.sig"

      - name: Configure restricted SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Require a VPS control-plane preflight before upload
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          HELPER_SHA: ${{ steps.checksums.outputs.helper_sha }}
          BRIDGE_SHA: ${{ steps.checksums.outputs.bridge_sha }}
          CONTROL_PLANE_SHA: ${{ steps.checksums.outputs.control_plane_sha }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-update-components preflight '$HELPER_SHA' '$BRIDGE_SHA' '$CONTROL_PLANE_SHA'"

      - name: Build the signed payload for the existing root-owned installer
        id: upload
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          payload_dir="$RUNNER_TEMP/aifoo-control-plane-payload"
          archive="$RUNNER_TEMP/aifoo-control-plane-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          manifest="$RUNNER_TEMP/aifoo-control-plane-signing/manifest.env"
          signature="$RUNNER_TEMP/aifoo-control-plane-signing/manifest.sig"
          install -d -m 700 "$payload_dir"
          install -m 0755 deploy/backend/deploy-backend.sh "$payload_dir/deploy-backend.sh"
          install -m 0755 "$RUNNER_TEMP/aifoo-update-bridge" "$payload_dir/aifoo-update-bridge"
          install -m 0600 "$manifest" "$payload_dir/manifest.env"
          install -m 0600 "$signature" "$payload_dir/manifest.sig"
          tar -C "$payload_dir" -czf "$archive" \
            deploy-backend.sh aifoo-update-bridge manifest.env manifest.sig
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          printf '%s\n' "$archive_sha" | grep -Eq '^[0-9a-f]{64}$'
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          scp -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$archive" \
            "$VPS_USER@$VPS_HOST:/tmp/aifoo-control-plane-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

      - name: Atomically install helper and bridge without touching Sub2API
        id: install
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          HELPER_SHA: ${{ steps.checksums.outputs.helper_sha }}
          BRIDGE_SHA: ${{ steps.checksums.outputs.bridge_sha }}
          CONTROL_PLANE_SHA: ${{ steps.checksums.outputs.control_plane_sha }}
          ARCHIVE_SHA: ${{ steps.upload.outputs.archive_sha }}
        run: |
          set -euo pipefail
          archive="/tmp/aifoo-control-plane-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-update-components install '$archive' '$ARCHIVE_SHA' '$HELPER_SHA' '$BRIDGE_SHA' '$CONTROL_PLANE_SHA'"

      - name: Verify the installed control-plane components
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          HELPER_SHA: ${{ steps.checksums.outputs.helper_sha }}
          BRIDGE_SHA: ${{ steps.checksums.outputs.bridge_sha }}
          CONTROL_PLANE_SHA: ${{ steps.checksums.outputs.control_plane_sha }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-update-components verify '$HELPER_SHA' '$BRIDGE_SHA' '$CONTROL_PLANE_SHA'"

      - name: Roll back only the control-plane components after a failed verification
        if: failure() && steps.install.outputs.attempted == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/deploy-update-components rollback '${{ steps.checksums.outputs.control_plane_sha }}'" || true

      - name: Record the maintenance boundary
        if: always()
        run: |
          {
            echo '### VPS control-plane maintenance'
            echo
            echo '- Scope: backend helper and web-update bridge only.'
            echo '- The VPS helper accepts only signed payloads verified by its root-owned public key.'
            echo '- No Docker Compose, database, Nginx, or Sub2API service command is issued by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
