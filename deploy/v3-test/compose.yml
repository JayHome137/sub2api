name: aifoo-v3-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sub2api"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
  sub2api:
    image: weishaw/sub2api:0.2.4
    ports:
      - "127.0.0.1:18084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIN_EMAIL: admin@v3-test.invalid
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
      TZ: Asia/Shanghai
    volumes:
      - backend:/app/data
  frontend:
    image: aifoo-v3-test-frontend:local
    depends_on:
      - sub2api
    ports:
      - "${TEST_BIND_IP:-127.0.0.1}:${TEST_PORT:-18083}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  postgres:
  backend:
