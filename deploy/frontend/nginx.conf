map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  include /etc/nginx/snippets/aifoo-security-headers.conf;

  location = /frontend-health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = / {
    try_files /index.html =404;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /home {
    try_files /index.html =404;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /index.html {
    try_files /index.html =404;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /pricing.html {
    try_files /pricing.html =404;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /docs-nodejs.html {
    try_files /docs-nodejs.html =404;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location = /aifoo-docs-api-scripts.js {
    try_files /aifoo-docs-api-scripts.js =404;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location ~ ^/(?:shell-bootstrap|console-override|auth-override|auth-preload|auth-theme-toggle)(?:\.css|\.js)$ {
    return 404;
  }

  location /landing-assets/ {
    try_files $uri =404;
    access_log off;
    expires 7d;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Keep every current Sub2API API surface on the backend. The remaining
  # routes are served by the source-built Vue SPA below.
  location ~ ^/(?:api(?:/|$)|v1(?:/|$)|v1beta(?:/|$)|backend-api(?:/|$)|antigravity(?:/|$)|responses(?:/|$)|alpha(?:/|$)|models$|messages(?:/|$)|chat(?:/|$)|embeddings$|images(?:/|$)|videos(?:/|$)|health$|setup/status$) {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sub2api_backend sub2api:8080;

    proxy_pass http://$sub2api_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header X-Accel-Buffering "no" always;
  }

  location = /app.html {
    internal;
    try_files /app.html =404;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /app.html;
    include /etc/nginx/snippets/aifoo-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }
}
